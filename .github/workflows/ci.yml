name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The native modules (node-pty, serialport) are compiled against the local
      # Electron ABI. The build tools are present on the Windows runner image.
      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate board packs
        run: npm run validate:profiles

      # The contract is the authority: the vocabulary in the YAML, the tables in
      # the document and the vocabulary in the code have to be the same thing.
      - name: Check the vocabulary
        run: npm run gen:vocabulary:check

      # The repository is written in English. The gate allows Chinese only in
      # the zh-Hans half of a localised pair and in the files that are Chinese
      # on purpose.
      - name: Check the language
        run: npm run check:language

      # Every reference in the contract layer has to resolve: a cross-file
      # section that does not exist, a pointer outside this repository, a
      # section number used twice, a path that is not there.
      - name: Check the links of the contract
        run: npm run check:links
