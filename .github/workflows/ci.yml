name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The native modules (node-pty, serialport) are NAPI modules: the prebuilt
      # binaries that ship with them are used, so no compiler is needed. The
      # build tools are on the runner image for the rare case where one of them
      # does not fit.
      # `npm ci` and not `npm install`: the lock file is what the repository
      # says it ships — `npm install` may change it and install something
      # else than the lock file says.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate board packs
        run: npm run validate:profiles

      # The contract is the authority: the vocabulary in the YAML, the tables in
      # the document and the vocabulary in the code have to be the same thing.
      - name: Check the vocabulary
        run: npm run gen:vocabulary:check

      # The repository is written in English. The gate allows Chinese only in
      # the zh-Hans half of a localised pair and in the files that are Chinese
      # on purpose.
      - name: Check the language
        run: npm run check:language

      # Every reference in the contract layer has to resolve: a cross-file
      # section that does not exist, a pointer outside this repository, a
      # section number used twice, a path that is not there.
      - name: Check the links of the contract
        run: npm run check:links

  # ── The packaging ──
  #
  # → **The installed application is a different thing than the source tree**
  #   ✓ → the asar has to hold the cards ✓ the connection profiles ✓ the
  #   native modules ✓ → and **that is invisible until it is installed** ✓
  #   (the build is green ✓ the tests are green ✓ → and the installed
  #   application has not one card ✗).
  # → So the packaging is a criterion that runs **on every push** ✓ — not
  #   only when a release is made ✓.
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the installer
        run: npm run dist

      - name: The artefact is complete
        run: npm run check:package

  # ── The tests that need the real application ──
  #
  # → The unit tests run the **modules** ✓ — the e2e runs the **application**
  #   ✓ (a real Electron ✓ · the cards in their iframes ✓ · the protocol ✓ ·
  #   the preload ✓) → **the boundaries that the unit tests cannot reach** ✓.
  # → They were missing here ✓ (found on 2026-11-21 ✓) → and they are the
  #   ones that catch "it works in the module but not in the app" ✓.
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # → The e2e runs against a **real build** ✓ (`out/` ✓ — the harness
      #   starts the application from it ✓).
      - name: Build
        run: npm run build

      # → **One worker** ✓ (a serial line is exclusive ✓ — the e2e cannot
      #   run two applications at the same time ✓).
      - name: The end-to-end tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ── Do the tests still catch the bugs? ──
  #
  # → The mutation check **breaks the code on purpose** ✓ and sees whether a
  #   test turns red ✓ → a test that does not catch anything is a test that
  #   proves nothing ✓ (found on 2026-11-21 ✓: the e2e and the mutation check
  #   were not in the pipeline ✓).
  # → **Its own job** ✓: it rewrites the sources in place ✓ → it must not run
  #   next to another job that uses the same tree ✓.
  mutation:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # → **Do the guards still point at the real code?** ✓ (a guard whose
      #   text is gone ✓ proves nothing ✓) → it takes two seconds ✓ → the
      #   whole check takes an hour ✓.
      - name: The guards still apply
        run: node scripts/check-stale-mutants.mjs

      # → The mutation check restores the sources itself ✓ (it writes them back
      #   ✓) → the job may end in any state ✓.
      - name: The mutation check
        run: npm run mutation:check
