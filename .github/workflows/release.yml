name: Release

# → **A release is a tag** ✓ — `v0.1.0` ✓ → the tag carries the version ✓
#   and the artefact carries the same one ✓ (the criterion below ✓).
on:
  push:
    tags: ['v*']
  # → **A manual run** ✓ — the first release does not have to be a tag yet ✓
  #   (the version of the package is what it is ✓).
  workflow_dispatch:

# → **The release needs to write** ✓ (the token of the repository ✓).
permissions:
  contents: write

jobs:
  windows:
    name: the Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # → **The version of the release** ✓ — it is **one thing** ✓ and it is
      #   written down before the build ✓.
      # → **A tag push** ✓ → the tag is the version ✓ (the tag decides the
      #   name of the release ✓ · the guard below says that it has to agree
      #   with the package ✓).
      # → **A manual run** ✓ → there is no tag ✓ → the version of the package
      #   is the version ✓ and the tag is made from it ✓ (**a branch name is
      #   never a version** ✓ — a release called "master" is not a version ✓
      #   · found on 2026-11-22 ✓).
      - name: The version of the release
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("$env:GITHUB_REF_TYPE" -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$version"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "[release] the tag is $tag (the package says $version)"

      # → **The tag and the package have to agree** ✓ — otherwise the release
      #   says one version ✓ and the installer carries another ✓.
      - name: The version of the tag must be the version of the package
        run: npm run release:check -- "${{ steps.version.outputs.tag }}"

      # → **The installer** ✓ (NSIS ✓ — a setup.exe ✓).
      - name: Build the installer
        run: npm run dist

      # → **The artefact is complete** ✓ — the asar has to hold the cards ✓
      #   the profiles ✓ and the native modules ✓ — **the installed
      #   application without them is empty** ✓, and that is invisible until
      #   it is installed ✓ (contract: the packaging is a criterion ✓).
      - name: Check the packaged artefact
        run: npm run check:package

      # → **The checksum** ✓ — the person who downloads the installer can
      #   check that it is the one this release built ✓.
      - name: The checksum of the installer
        shell: pwsh
        run: |
          $file = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      # → **The release** ✓ — the page where the people download it ✓.
      # → **The name states the version and the system** ✓ (the artefact's
      #   name says it too ✓ — `DevBoardCockpit-<version>-win-x64-setup.exe` ✓).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/*-setup.exe, release/SHA256SUMS.txt | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "there is no installer in release/" }
          $title = "DevBoardCockpit $env:TAG (Windows x64)"
          if (gh release view $env:TAG 2>$null) {
            # → The release exists ✓ (a second run of the same tag ✓) → the
            #   files are replaced ✓.
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --generate-notes --title $title
          }
