name: Release

# → **A release is a tag** ✓ — `v0.1.0` ✓ → the tag carries the version ✓
#   and the artefact carries the same one ✓ (the criterion below ✓).
on:
  push:
    tags: ['v*']
  # → **A manual run** ✓ — the first release does not have to be a tag yet ✓
  #   (the version of the package is what it is ✓).
  workflow_dispatch:

# → **The release needs to write** ✓ (the token of the repository ✓).
permissions:
  contents: write

jobs:
  windows:
    name: the Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # → **The tag and the package have to agree** ✓ — otherwise the release
      #   says one version ✓ and the installer carries another ✓.
      - name: The version of the tag must be the version of the package
        run: npm run release:check -- "${{ github.ref_name }}"

      # → **The installer** ✓ (NSIS ✓ — a setup.exe ✓).
      - name: Build the installer
        run: npm run dist

      # → **The artefact is complete** ✓ — the asar has to hold the cards ✓
      #   the profiles ✓ and the native modules ✓ — **the installed
      #   application without them is empty** ✓, and that is invisible until
      #   it is installed ✓ (contract: the packaging is a criterion ✓).
      - name: Check the packaged artefact
        run: npm run check:package

      # → **The checksum** ✓ — the person who downloads the installer can
      #   check that it is the one this release built ✓.
      - name: The checksum of the installer
        shell: pwsh
        run: |
          $file = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      # → **The release** ✓ — the page where the people download it ✓.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/*-setup.exe, release/SHA256SUMS.txt | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "there is no installer in release/" }
          if (gh release view $TAG 2>$null) {
            # → The release exists ✓ (a second run of the same tag ✓) → the
            #   files are replaced ✓.
            gh release upload $TAG @files --clobber
          } else {
            gh release create $TAG @files --generate-notes --title "DevBoardCockpit $TAG"
          }
