# Core vocabulary — the machine-readable authority
#
# This file is the single authority for the core vocabulary. The Markdown table in
# `docs/spec/01-tag-contract.md` is the human-readable rendering of this file and is
# generated from it; the two must agree entry by entry, and the implementation layer
# must also generate its machine-readable form from this file (the validator, the
# runtime and describe_tag share one copy).
#
# Rules (from spec/01 sections 1 and 6):
#   1. The name carries no board model: `cpu.usage` must mean the same thing on every board.
#   2. A quantity whose semantics cannot be written down does not enter the core vocabulary.
#   3. Adding a core tag is a contract version bump. A board pack may only declare which core tags it implements.
#   4. `type` is one of {number, string, boolean, enum}.
#   5. `unit` is an SI unit or dimensionless; the unit goes into the name (`mem.total_bytes`).
#   6. `v1`: whether a board pack has to provide it in this version.
#        required — a v1 board pack should provide it; when it is missing the tag reports unavailable.
#        reserved — the vocabulary reserves it but v1 requires no pack to provide it
#                   (the semantics are already claimed, the implementation follows the version).
#
# Format: one YAML block per entry, the field order is fixed so that the entries can be
# compared one by one.
#
# Why the backlight is not in the core vocabulary: this board has two backlights (backlight
# and backlight1); both the naming and the scale are specific to the board, so they do not
# meet the admission threshold of "the semantics are the same on every board".
# Both instances therefore go through `custom.rk3588-atk.*` (the user decided this on
# 2026-11-12; see item C2 of the contract reconciliation checklist).
entries:
  - pattern: cpu.usage
    type: number
    unit: percent
    range: [0, 100]
    semantics: The share of the time in the past second during which all CPU cores executed non-idle instructions
    v1: required

  - pattern: cpu.core.*.usage
    type: number
    unit: percent
    range: [0, 100]
    semantics: The share of the time in the past second during which a single CPU core executed non-idle instructions
    v1: required

  - pattern: cpu.core.*.cluster
    type: string
    unit: "-"
    range: "open enumeration"
    semantics: The name of the cluster the CPU core belongs to, such as A55 / A76. An unknown name is reported verbatim as a string and is not an error
    v1: required

  - pattern: cpu.governor
    type: enum
    unit: "-"
    range: "open enumeration"
    semantics: The CPU frequency scaling policy in effect (the `scaling_governor` of cpufreq), such as `schedutil`. The value of cpu0 is taken; each core can be set independently
    v1: required

  - pattern: gpu.usage
    type: number
    unit: percent
    range: [0, 100]
    semantics: The current GPU reading: the share of the time executing non-idle instructions. The sampling window is decided by the driver and is not a fixed one second
    v1: required

  - pattern: gpu.freq_hz
    type: number
    unit: hertz
    range: "≥0"
    semantics: The current GPU operating frequency
    v1: required

  - pattern: npu.usage
    type: number
    unit: percent
    range: [0, 100]
    semantics: The current NPU reading: the maximum of the utilisation of the compute cores. The sampling window is decided by the driver and is not a fixed one second
    v1: required

  - pattern: npu.core.*.usage
    type: number
    unit: percent
    range: [0, 100]
    semantics: The current utilisation of a single NPU compute core
    v1: required

  - pattern: mem.total_bytes
    type: number
    unit: byte
    range: ">0"
    semantics: The total amount of physical memory
    v1: required

  - pattern: mem.available_bytes
    type: number
    unit: byte
    range: "≥0"
    semantics: The memory that can be handed to a new process without swapping (MemAvailable)
    v1: required

  - pattern: mem.used_bytes
    type: number
    unit: byte
    range: "≥0"
    semantics: The used memory = MemTotal - MemAvailable (excluding the reclaimable page cache)
    v1: required

  - pattern: mem.usage
    type: number
    unit: percent
    range: [0, 100]
    semantics: The percentage of the total physical memory that is in use
    v1: required

  - pattern: temp.soc
    type: number
    unit: celsius
    range: "-"
    semantics: The SoC core temperature, merged by the `type` of the thermal zone and not depending on the zone index
    v1: required

  - pattern: temp.gpu
    type: number
    unit: celsius
    range: "-"
    semantics: The GPU temperature, merged by the `type` of the thermal zone
    v1: required

  - pattern: temp.npu
    type: number
    unit: celsius
    range: "-"
    semantics: The NPU temperature, merged by the `type` of the thermal zone
    v1: required

  - pattern: board.model
    type: string
    unit: "-"
    range: "-"
    semantics: The board model string, used to identify the board pack automatically
    v1: required

  - pattern: board.kernel
    type: string
    unit: "-"
    range: "-"
    semantics: The kernel version string of the running system
    v1: reserved

  - pattern: net.rx_bytes
    type: number
    unit: byte
    range: "≥0"
    semantics: The number of bytes received in total since boot
    v1: reserved

  - pattern: net.tx_bytes
    type: number
    unit: byte
    range: "≥0"
    semantics: The number of bytes sent in total since boot
    v1: reserved

  - pattern: disk.*.free_bytes
    type: number
    unit: byte
    range: "≥0"
    semantics: The number of bytes available on the file system that holds a given mount point
    v1: reserved

  - pattern: disk.*.total_bytes
    type: number
    unit: byte
    range: "≥0"
    semantics: The total number of bytes on the file system that holds a given mount point
    v1: reserved
