<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="generator" content="DSH (DeepSeek Harness)">
<title>卡片工作台 · UI 示例 v2 · DSH</title>
<style>
:root{
  --bg0:#0A0C0F; --bg1:#12151A; --bg2:#161A20; --bg3:#1C2129;
  --border:#252C36; --border-strong:#333C49;
  --text0:#E6EAF2; --text1:#9BA6B6; --text2:#6C7787;
  --accent:#58A6FF; --accent-soft:rgba(88,166,255,.12); --accent-on:#08131F;
  --accent-2:#7EE787;
  --ok:#3FB950; --warn:#D29922; --danger:#F85149; --unknown:#6E7681;
  --chip:rgba(255,255,255,.045);
  --card-shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 10px 30px rgba(0,0,0,.20);
  --radius:10px; --radius-sm:6px;
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
}
html.light{
  --bg0:#F5F6F7; --bg1:#FFFFFF; --bg2:#FFFFFF; --bg3:#F0F1F3;
  --border:#E4E6EA; --border-strong:#D2D6DC;
  --text0:#1F2329; --text1:#646A73; --text2:#8F959E;
  --accent:#3370FF; --accent-soft:rgba(51,112,255,.10); --accent-on:#FFFFFF;
  --accent-2:#00B42A;
  --ok:#00B42A; --warn:#FF7D00; --danger:#F53F3F; --unknown:#8F959E;
  --chip:rgba(31,35,41,.045);
  --card-shadow:0 1px 2px rgba(31,35,41,.04), 0 6px 18px rgba(31,35,41,.05);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:
    radial-gradient(1100px 520px at 16% -12%, rgba(88,166,255,.10), transparent 62%),
    radial-gradient(900px 480px at 102% -6%, rgba(126,231,135,.05), transparent 58%),
    var(--bg0);
  color:var(--text0);
  font-family:var(--font-ui); font-size:13px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
html.light body{
  background:
    radial-gradient(1100px 520px at 16% -12%, rgba(51,112,255,.07), transparent 62%),
    radial-gradient(900px 480px at 102% -6%, rgba(0,180,42,.04), transparent 58%),
    var(--bg0);
}
svg{display:block}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------- shell ---------- */
.shell{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:14px;padding:0 14px 0 14px;
  border-bottom:1px solid var(--border);background:var(--bg1);z-index:5}
.brand{display:flex;align-items:center;gap:9px;min-width:186px;color:var(--text0)}
.brand .logo{width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:linear-gradient(145deg,rgba(88,166,255,.22),rgba(126,231,135,.10));
  border:1px solid rgba(88,166,255,.30);color:var(--accent)}
.brand .logo svg{width:14px;height:14px}
.brand .bname{font-size:12.5px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .bname span{color:var(--text2);font-weight:500}
.conn{display:flex;align-items:center;gap:8px;height:26px;padding:0 11px;border:1px solid var(--border);
  border-radius:999px;background:var(--chip);font-size:11.5px;white-space:nowrap}
.conn .name{font-weight:600}
.conn .meta{color:var(--text2);font-family:var(--font-mono);font-size:10px}
.led{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px;
  box-shadow:0 0 0 3px rgba(63,185,80,.14),0 0 9px rgba(63,185,80,.65)}
.led.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(210,153,34,.14),0 0 9px rgba(210,153,34,.5)}
.led.danger{background:var(--danger);box-shadow:0 0 0 3px rgba(248,81,73,.14),0 0 9px rgba(248,81,73,.5)}
.led.idle{background:var(--unknown);box-shadow:none}
.topspacer{flex:1}
.pulse{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text2);white-space:nowrap}
.pulse .mono{font-family:var(--font-mono);color:var(--text1)}
.iconbtn{width:26px;height:26px;border:1px solid transparent;border-radius:6px;background:none;
  color:var(--text2);display:flex;align-items:center;justify-content:center}
.iconbtn:hover{border-color:var(--border);background:var(--chip);color:var(--text1)}
.palette{margin-left:2px;display:flex;align-items:center;gap:9px;height:26px;padding:0 10px;
  border:1px solid var(--border);border-radius:7px;color:var(--text2);font-size:11px;background:var(--bg2);min-width:236px}
.palette kbd{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;padding:2px 5px;border:1px solid var(--border-strong);
  border-radius:4px;color:var(--text1);background:var(--bg3)}

.body{flex:1;min-height:0;display:flex}

/* ---------- rail ---------- */
.rail{width:56px;flex:0 0 56px;border-right:1px solid var(--border);background:var(--bg1);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;z-index:4}
.rail-item{width:44px;height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--text2);font-size:9px;letter-spacing:.1px;position:relative;background:none;border:0}
.rail-item svg{width:17px;height:17px}
.rail-item:hover{background:var(--chip);color:var(--text1)}
.rail-item.active{color:var(--text0);background:var(--bg3)}
.rail-item.active::before{content:"";position:absolute;left:-6px;top:13px;bottom:13px;width:2px;border-radius:2px;background:var(--accent)}
.rail-spacer{flex:1}

/* ---------- main + tabs ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabsbar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:4px;padding:0 14px 0 8px;
  border-bottom:1px solid var(--border);background:var(--bg1)}
.viewtabs{display:flex;align-items:stretch;height:100%}
.viewtab{height:100%;padding:0 13px;border:0;background:none;color:var(--text2);font-size:12.5px;position:relative;white-space:nowrap}
.viewtab:hover{color:var(--text1)}
.viewtab.active{color:var(--text0);font-weight:600}
.viewtab.active::after{content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:2px;
  background:var(--accent);border-radius:2px 2px 0 0}
.viewtab.add{padding:0 7px;color:var(--text2)}
.viewtab.add svg{width:14px;height:14px}
.tabsep{width:1px;height:16px;background:var(--border);margin:0 8px;flex:0 0 1px}
.pillbtn{height:23px;padding:0 9px;border:1px solid transparent;border-radius:999px;background:none;
  color:var(--text2);font-size:10.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pillbtn:hover{border-color:var(--border);background:var(--chip);color:var(--text1)}
.pillbtn.active{color:var(--text0);background:var(--chip);border-color:var(--border)}
.pillbtn .n{font-family:var(--font-mono);font-size:9.5px;color:var(--text2)}
.pillbtn.active .n{color:var(--accent)}
.tabspacer{flex:1}
.tool{height:26px;display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid transparent;
  border-radius:6px;background:none;color:var(--text1);font-size:11.5px;white-space:nowrap}
.tool:hover{border-color:var(--border);background:var(--chip)}
.tool svg{width:14px;height:14px;opacity:.85}
.tool.icon{width:27px;justify-content:center;padding:0}
.btn{height:28px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg2);color:var(--text1);font-size:11.5px;white-space:nowrap}
.btn:hover{border-color:var(--border-strong);color:var(--text0)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--chip);color:var(--text1)}

.content{flex:1;min-height:0;display:flex;overflow:hidden}
.workarea{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ---------- grid + cards ---------- */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  grid-auto-rows:60px;gap:12px;padding:16px 20px 20px;align-content:start;overflow:hidden}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;box-shadow:var(--card-shadow)}
.card.sel{border-color:rgba(88,166,255,.55);box-shadow:0 0 0 1px rgba(88,166,255,.20),0 14px 34px rgba(0,0,0,.26)}
html.light .card.sel{border-color:rgba(51,112,255,.55);box-shadow:0 0 0 1px rgba(51,112,255,.16),0 10px 26px rgba(31,35,41,.08)}
.card-head{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
html.light .card-head{background:linear-gradient(180deg,#FFFFFF,#FCFCFD)}
.card-ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--text1);background:var(--chip);border:1px solid var(--border);flex:0 0 22px}
.card-ico svg{width:12px;height:12px}
.card-title{font-size:12.5px;font-weight:600;letter-spacing:.1px;white-space:nowrap}
.card-sub{font-size:10px;color:var(--text2);font-family:var(--font-mono);white-space:nowrap}
.card-tools{margin-left:auto;display:flex;align-items:center;gap:1px;color:var(--text2)}
.ghostbtn{width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--text2);
  display:flex;align-items:center;justify-content:center}
.ghostbtn:hover{background:var(--chip);color:var(--text1)}
.ghostbtn svg{width:14px;height:14px}
.card-body{flex:1;min-height:0;padding:12px 14px;overflow:hidden;display:flex;flex-direction:column}
.chip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:5px;
  border:1px solid var(--border);background:var(--chip);color:var(--text1);
  font-family:var(--font-mono);font-size:9.5px;white-space:nowrap}
.chip.accent{color:var(--accent);border-color:rgba(88,166,255,.28);background:var(--accent-soft)}
.chip.ok{color:var(--ok);border-color:rgba(63,185,80,.30);background:rgba(63,185,80,.08)}
.chip.warn{color:var(--warn);border-color:rgba(210,153,34,.30);background:rgba(210,153,34,.08)}
.chip.danger{color:var(--danger);border-color:rgba(248,81,73,.32);background:rgba(248,81,73,.08)}

.c-target{grid-column:span 4;grid-row:span 4}
.c-golden{grid-column:span 8;grid-row:span 4}
.c-terminal{grid-column:span 8;grid-row:span 5}
.c-files{grid-column:span 4;grid-row:span 5}
.c-logs{grid-column:span 8;grid-row:span 3}
.c-audit{grid-column:span 4;grid-row:span 3}

/* target card */
.target-hero{display:flex;align-items:center;gap:10px}
.board-ico{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(88,166,255,.25);flex:0 0 38px}
.board-ico svg{width:20px;height:20px}
.tname{font-size:14px;font-weight:650;letter-spacing:.1px}
.tmeta{font-size:10.5px;color:var(--text2);margin-top:2px;font-family:var(--font-mono)}
.kv{display:grid;grid-template-columns:62px 1fr;row-gap:7px;margin:13px 0 0;font-size:11px;flex:1}
.kv dt{color:var(--text2);font-size:10.5px;padding-top:1px}
.kv dd{margin:0;color:var(--text0);font-family:var(--font-mono);font-size:10.5px;
  display:flex;align-items:center;gap:6px;min-width:0}
.kv dd .ok{color:var(--ok)}
.heart{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.heart .lab{font-size:9.5px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase}
.heart .val{font-family:var(--font-mono);font-size:10px;color:var(--text1)}

/* golden card */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 10px;min-width:0;position:relative;overflow:hidden}
.stat .lab{font-size:9.5px;color:var(--text2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.stat .lab .dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px}
.stat .val{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:-.6px;line-height:1.15;margin-top:3px}
.stat .val span{font-size:10px;color:var(--text2);font-weight:400;letter-spacing:0;margin-left:1px}
.stat .spark{position:absolute;right:7px;bottom:7px;opacity:.6}
.chartbox{margin-top:12px;flex:1;min-height:0;border:1px solid var(--border);border-radius:8px;
  background:linear-gradient(180deg,var(--bg3),transparent);padding:8px 10px 6px;display:flex;flex-direction:column}
.chart-top{display:flex;align-items:center;gap:12px;font-size:9.5px;color:var(--text2);padding:0 1px 5px}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:7px;height:3px;border-radius:2px;display:inline-block}
.chart-top .rng{margin-left:auto;display:flex;gap:2px}
.rng button{height:18px;padding:0 6px;border:0;border-radius:4px;background:none;color:var(--text2);font-size:9px}
.rng button.on{background:var(--chip);color:var(--text1)}
.chartbox .plot{flex:1;min-height:0}
.chartbox .plot svg{width:100%;height:100%}
.axis{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:8.5px;color:var(--text2);padding:4px 8px 0}

/* terminal */
.termbox{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--border);
  border-radius:8px;overflow:hidden;background:#07090C}
html.light .termbox{background:#0D1117;border-color:#242B35}
.term-tabs{height:29px;flex:0 0 29px;display:flex;align-items:center;gap:2px;padding:0 7px;
  background:#0A0E13;border-bottom:1px solid #1A212A}
html.light .term-tabs{background:#11161D;border-color:#1F2731}
.term-tab{height:21px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:5px;
  font-size:10px;color:#6C7787;border:1px solid transparent}
.term-tab.active{color:#E6EAF2;background:#151C25;border-color:#232C38}
.term-tab .led{width:5px;height:5px;flex:0 0 5px;box-shadow:none}
.term-lines{flex:1;min-height:0;margin:0;padding:9px 12px;font-family:var(--font-mono);
  font-size:11px;line-height:1.82;color:#9BA6B6;white-space:pre-wrap;overflow:hidden}
.t-p{color:#7EE787}.t-c{color:#E6EAF2}.t-d{color:#58A6FF}.t-w{color:#D29922}.t-e{color:#F85149}.t-m{color:#5F6B7D}
.cursor{display:inline-block;width:6px;height:12px;margin-left:1px;vertical-align:-2px;background:#58A6FF;opacity:.85}

/* files */
.filesbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
.dualpane{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane{border:1px solid var(--border);border-radius:8px;background:var(--bg3);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{height:27px;flex:0 0 27px;display:flex;align-items:center;gap:6px;padding:0 8px;
  border-bottom:1px solid var(--border);font-size:9.5px;color:var(--text2);font-family:var(--font-mono);
  white-space:nowrap;overflow:hidden}
.pane-h b{color:var(--text1);font-weight:600}
.pane ul{list-style:none;margin:0;padding:4px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.pane li{display:flex;align-items:center;gap:6px;height:21px;padding:0 6px;border-radius:5px;
  font-family:var(--font-mono);font-size:9.5px;color:var(--text1);white-space:nowrap;overflow:hidden}
.pane li svg{width:12px;height:12px;flex:0 0 12px;opacity:.7}
.pane li.dir{color:var(--text0);font-weight:600}
.pane li.sel{background:var(--accent-soft);color:var(--text0)}
.pane li .sz{margin-left:auto;color:var(--text2);font-size:8.5px}
.filefoot{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:9.5px;color:var(--text2)}
.progress{flex:1;height:3px;border-radius:2px;background:var(--bg3);overflow:hidden;border:1px solid var(--border)}
.progress i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px}

/* logs */
.loglist{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
.logrow{display:flex;align-items:center;gap:8px;height:27px;flex:0 0 27px;border-bottom:1px dashed var(--border);min-width:0}
.logrow:last-child{border-bottom:0}
.log-time{width:50px;flex:0 0 50px;font-family:var(--font-mono);font-size:9px;color:var(--text2)}
.lvl{width:40px;flex:0 0 40px;text-align:center;font-family:var(--font-mono);font-size:8.5px;
  padding:1px 0;border-radius:4px;border:1px solid}
.lvl.info{color:var(--accent);border-color:rgba(88,166,255,.30);background:var(--accent-soft)}
.lvl.warn{color:var(--warn);border-color:rgba(210,153,34,.30);background:rgba(210,153,34,.08)}
.lvl.err{color:var(--danger);border-color:rgba(248,81,73,.32);background:rgba(248,81,73,.08)}
.lvl.ok{color:var(--ok);border-color:rgba(63,185,80,.30);background:rgba(63,185,80,.08)}
.log-msg{flex:1;min-width:0;font-size:10px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-src{font-family:var(--font-mono);font-size:8.5px;color:var(--text2);flex:0 0 auto}

/* audit */
.auditlist{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.auditrow{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);min-width:0}
.auditrow:last-child{border-bottom:0}
.audit-time{width:46px;flex:0 0 46px;font-family:var(--font-mono);font-size:9px;color:var(--text2);padding-top:1px}
.audit-main{flex:1;min-width:0}
.audit-act{font-family:var(--font-mono);font-size:9.5px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audit-sub{font-size:9px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* inspector */
.inspector{width:320px;flex:0 0 320px;border-left:1px solid var(--border);background:var(--bg1);
  display:flex;flex-direction:column;min-height:0;z-index:3}
.insp-head{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid var(--border)}
.insp-ico{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  border:1px solid rgba(88,166,255,.25);display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.insp-ico svg{width:16px;height:16px}
.insp-title{font-size:12.5px;font-weight:650}
.insp-sub{font-size:9.5px;color:var(--text2);margin-top:2px;font-family:var(--font-mono);white-space:nowrap}
.insp-head .ghostbtn{margin-left:auto}
.insp-tabs{height:34px;flex:0 0 34px;display:flex;align-items:stretch;padding:0 9px;border-bottom:1px solid var(--border);gap:2px}
.insp-tab{display:flex;align-items:center;padding:0 9px;font-size:11px;color:var(--text2);position:relative;background:none;border:0}
.insp-tab.active{color:var(--text0);font-weight:600}
.insp-tab.active::after{content:"";position:absolute;left:7px;right:7px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.insp-body{flex:1;min-height:0;padding:13px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.insp-sec{display:flex;flex-direction:column;gap:7px}
.insp-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);font-weight:600}
.tagrow{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;padding:6px 8px;min-width:0}
.tagrow .tname{font-family:var(--font-mono);font-size:9.5px;color:var(--text1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow .tval{font-family:var(--font-mono);font-size:10px;color:var(--text0);white-space:nowrap}
.tagrow .tunit{font-size:8.5px;color:var(--text2)}
.insp-kv{display:flex;justify-content:space-between;gap:10px;font-size:10px;line-height:1.9}
.insp-kv .k{color:var(--text2)}
.insp-kv .v{color:var(--text1);font-family:var(--font-mono);font-size:9.5px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-chips{display:flex;flex-wrap:wrap;gap:5px}
.insp-act{display:flex;align-items:flex-start;gap:7px;font-size:9.5px;color:var(--text2);line-height:1.55}
.insp-act .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:4px;flex:0 0 5px}
.insp-act b{color:var(--text1);font-weight:600}
.insp-foot{flex:0 0 auto;display:flex;gap:7px;padding:11px 13px;border-top:1px solid var(--border)}
.insp-foot .btn{flex:1;justify-content:center;height:27px}

/* ---------- library ---------- */
.libmain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.libhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 24px 10px}
.libhead h1{font-size:20px;font-weight:650;letter-spacing:-.2px;margin:0}
.libhead p{margin:5px 0 0;font-size:11px;color:var(--text2)}
.libhead p b{color:var(--text1);font-weight:600}
.libactions{display:flex;gap:8px}
.libfilters{display:flex;align-items:center;gap:9px;padding:6px 24px 12px}
.fchip{height:24px;padding:0 10px;border-radius:999px;border:1px solid transparent;background:none;
  color:var(--text2);font-size:11px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.fchip:hover{background:var(--chip);color:var(--text1)}
.fchip.active{background:var(--chip);border-color:var(--border);color:var(--text0);font-weight:600}
.fchip .n{font-family:var(--font-mono);font-size:9px;color:var(--text2)}
.fchip.active .n{color:var(--accent)}
.fchip .led{width:5px;height:5px;flex:0 0 5px;box-shadow:none}
.fspacer{flex:1}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg2)}
.seg button{height:24px;padding:0 10px;border:0;background:none;color:var(--text2);font-size:10.5px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--chip);color:var(--text0)}
.libcontent{flex:1;min-height:0;display:grid;grid-template-columns:344px minmax(0,1fr);gap:16px;padding:0 24px 20px;overflow:hidden}
.liblist{background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--card-shadow)}
.liblist-head{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}
.liblist-head .t{font-size:11.5px;font-weight:600}
.liblist-head .c{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--text2)}
.librows{flex:1;min-height:0;overflow:hidden;padding:5px;display:flex;flex-direction:column;gap:2px}
.libdrop{margin-top:auto;border:1px dashed var(--border-strong);border-radius:8px;padding:11px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text2);font-size:10px;flex:0 0 auto}
.libdrop svg{width:14px;height:14px}
.librow{display:flex;align-items:center;gap:10px;height:62px;padding:7px 7px;border-radius:8px;position:relative;min-width:0}
.librow:hover{background:var(--chip)}
.librow.sel{background:var(--accent-soft)}
.librow.sel::before{content:"";position:absolute;left:-5px;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--accent)}
.thumb{width:62px;height:40px;flex:0 0 62px;border-radius:6px;border:1px solid var(--border);
  background:linear-gradient(160deg,var(--bg3),var(--bg2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.librow-main{flex:1;min-width:0}
.librow-name{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.librow-name .id{font-family:var(--font-mono);font-size:9px;color:var(--text2);font-weight:400}
.librow-meta{margin-top:3px;font-size:9.5px;color:var(--text2);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.librow-state{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.libdetail{background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;
  min-height:0;overflow:hidden;box-shadow:var(--card-shadow)}
.detail-head{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--border)}
.detail-head .t{font-size:12.5px;font-weight:600}
.detail-head .id{font-family:var(--font-mono);font-size:9.5px;color:var(--text2)}
.detail-head .badges{margin-left:auto;display:flex;gap:5px}
.detail-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;overflow:hidden;align-items:start}
.previewwrap{padding:16px;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.preview-chrome{border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;background:var(--bg1);
  display:flex;flex-direction:column;min-height:0;flex:1;box-shadow:0 12px 30px rgba(0,0,0,.22)}
html.light .preview-chrome{box-shadow:0 8px 22px rgba(31,35,41,.07)}
.preview-top{height:30px;flex:0 0 30px;display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--bg2);border-bottom:1px solid var(--border);font-size:9px;color:var(--text2);font-family:var(--font-mono)}
.preview-top .dots{display:flex;gap:3px;margin-right:2px}
.preview-top .dots i{width:5px;height:5px;border-radius:50%;background:var(--border-strong)}
.preview-top .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.preview-canvas{flex:0 0 auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:
  radial-gradient(600px 260px at 30% -20%, rgba(88,166,255,.07), transparent 60%),var(--bg0)}
html.light .preview-canvas{background:radial-gradient(600px 260px at 30% -20%, rgba(51,112,255,.05), transparent 60%),#F7F8FA}
.preview-title{display:flex;align-items:center;gap:8px}
.preview-title b{font-size:12px;font-weight:650}
.preview-title .live{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:8.5px;color:var(--text2);font-family:var(--font-mono)}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mini-stat{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
.mini-stat .k{font-size:8.5px;color:var(--text2);white-space:nowrap}
.mini-stat .v{font-family:var(--font-mono);font-size:14px;font-weight:600;margin-top:2px;letter-spacing:-.3px}
.mini-stat .v span{font-size:8px;color:var(--text2);font-weight:400}
.preview-chart{height:230px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);padding:8px 10px;overflow:hidden}
.preview-chart svg{width:100%;height:100%}
.pv-axis{display:flex;justify-content:space-between;align-items:center;font-size:8.5px;color:var(--text3);font-family:var(--font-mono);padding:0 2px}
.preview-foot{padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;
  background:var(--bg2);font-size:8.5px;color:var(--text2);font-family:var(--font-mono)}
.preview-foot .r{margin-left:auto;display:flex;gap:6px}
.pv-sec{margin-top:2px;border-top:1px solid var(--border);padding-top:10px}
.pv-cap{font-size:8.5px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.pv-table{font-family:var(--font-mono);font-size:9.5px;color:var(--text1)}
.pv-tr{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:8px;padding:4px 6px;border-radius:4px}
.pv-tr:nth-child(odd){background:var(--bg3)}
.pv-th{color:var(--text2);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;background:transparent!important}
.pv-tr span:not(:first-child){text-align:right}
.metawrap{padding:16px;display:flex;flex-direction:column;gap:13px;min-height:0;overflow:hidden}
.meta-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);font-weight:600;margin-bottom:7px}
.metagrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.metaitem .k{font-size:9px;color:var(--text2)}
.metaitem .v{font-size:10.5px;color:var(--text1);font-family:var(--font-mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metaitem .v.ok{color:var(--ok)}
.metaitem .v.warn{color:var(--warn)}
.checklist{display:flex;flex-direction:column;gap:6px}
.checkrow{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text1)}
.checkrow svg{width:13px;height:13px;flex:0 0 13px}
.checkrow .ok{color:var(--ok)}
.checkrow .warn{color:var(--warn)}
.checkrow .muted{color:var(--text2);margin-left:auto;font-size:9px;font-family:var(--font-mono)}
.timeline{display:flex;align-items:baseline;gap:8px;font-size:10px;color:var(--text1);padding:5px 0;border-bottom:1px dashed var(--border)}
.timeline:last-child{border-bottom:0}
.timeline .dotm{width:5px;height:5px;border-radius:50%;background:var(--text3);flex:0 0 5px;position:relative;top:-1px}
.timeline .tm{color:var(--text2);font-size:9px;min-width:66px;flex:0 0 66px;font-family:var(--font-mono)}
.timeline .tx{color:var(--text1);font-size:10px}
.detail-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg2)}
.detail-foot .note{font-size:9.5px;color:var(--text2);flex:1}

/* ---------- consent ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,7,10,.62);backdrop-filter:blur(7px);
  display:flex;align-items:center;justify-content:center}
html.light .overlay{background:rgba(31,35,41,.34)}
.sheet{width:620px;max-height:92vh;background:var(--bg1);border:1px solid var(--border-strong);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 34px 90px rgba(0,0,0,.55)}
html.light .sheet{box-shadow:0 24px 70px rgba(31,35,41,.22)}
.sheet-head{display:flex;gap:12px;padding:18px 20px 15px;border-bottom:1px solid var(--border);align-items:flex-start}
.sheet-ico{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  border:1px solid rgba(88,166,255,.25);display:flex;align-items:center;justify-content:center}
.sheet-ico svg{width:18px;height:18px}
.sheet-title{font-size:15px;font-weight:650;letter-spacing:-.1px}
.sheet-sub{font-size:10px;color:var(--text2);margin-top:3px;font-family:var(--font-mono);line-height:1.5}
.sheet-head .ghostbtn{margin-left:auto}
.sheet-body{padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.permgroup{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--bg2)}
.permgroup-h{height:33px;display:flex;align-items:center;gap:7px;padding:0 11px;background:var(--bg2);border-bottom:1px solid var(--border)}
.permgroup-h .t{font-size:10.5px;font-weight:600}
.permgroup-h .c{margin-left:auto;font-size:9px;color:var(--text2);font-family:var(--font-mono)}
.permchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 11px;background:var(--bg1)}
.chipm{font-family:var(--font-mono);font-size:9.5px;padding:3px 7px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--text1)}
.actrow{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-top:1px solid var(--border);background:var(--bg1)}
.actrow:first-child{border-top:0}
.actrow .ico{width:24px;height:24px;flex:0 0 24px;border-radius:6px;border:1px solid var(--border);
  background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--text1)}
.actrow .ico svg{width:12px;height:12px}
.actrow-main{flex:1;min-width:0}
.actname{font-family:var(--font-mono);font-size:10px;color:var(--text0);white-space:nowrap}
.actname .danger{color:var(--danger);font-weight:600}
.actdesc{font-size:9px;color:var(--text2);margin-top:3px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acttags{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.sheet-note{display:flex;gap:8px;font-size:9.5px;color:var(--text2);line-height:1.6;padding:0 2px}
.sheet-note svg{width:13px;height:13px;flex:0 0 13px;margin-top:1px;color:var(--warn)}
.sheet-foot{display:flex;align-items:center;gap:9px;padding:13px 20px;border-top:1px solid var(--border);background:var(--bg2)}
.sheet-foot .note{font-size:9.5px;color:var(--text2);flex:1;font-family:var(--font-mono)}

/* ================= v2 · cockpit deck（车机质感 / 多形态卡片 / 控制卡） ================= */
.v2{--hairline:rgba(255,255,255,.09); --hairline-2:rgba(255,255,255,.17);
  --srf-1:#1B222B; --srf-2:#141A21; --srf-3:#0F141A;
  --ambient:rgba(88,166,255,.10); --track:rgba(255,255,255,.09);
  --c2-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 40px rgba(0,0,0,.32),0 2px 8px rgba(0,0,0,.28)}
html.light .v2{--hairline:rgba(31,35,41,.10); --hairline-2:rgba(31,35,41,.18);
  --srf-1:#FFFFFF; --srf-2:#F8F9FB; --srf-3:#F3F5F7;
  --ambient:rgba(51,112,255,.07); --track:rgba(31,35,41,.09);
  --c2-shadow:0 1px 0 #FFFFFF inset,0 14px 32px rgba(31,35,41,.08),0 1px 3px rgba(31,35,41,.06)}
.v2 .topbar{height:44px;flex:0 0 44px;background:linear-gradient(180deg,#11161D,#0B0F14);border-bottom:1px solid var(--hairline);gap:16px}
.v2 .rail{width:58px;flex:0 0 58px;background:linear-gradient(180deg,#0F141B,#0A0E13);border-right:1px solid var(--hairline)}
.v2 .tabsbar{height:46px;flex:0 0 46px;background:linear-gradient(180deg,#10151C,#0C1116);border-bottom:1px solid var(--hairline)}
html.light .v2 .topbar,html.light .v2 .tabsbar{background:linear-gradient(180deg,#FFFFFF,#F7F8FA);border-bottom-color:var(--hairline)}
html.light .v2 .rail{background:#FFFFFF;border-right-color:var(--hairline)}
.v2 .brand .logo{box-shadow:0 0 14px rgba(88,166,255,.25)}
.v2 .deck{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.v2 .deck-wrap{flex:1;min-width:0;min-height:0;display:flex}
.v2 .deck-grid{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:60px;gap:12px;
  padding:14px 16px 16px;overflow:hidden;
  background:radial-gradient(900px 360px at 20% -12%,var(--ambient),transparent 60%),radial-gradient(720px 320px at 100% 0%,rgba(126,231,135,.045),transparent 55%)}
/* card material */
.card2{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
  border-radius:14px;border:1px solid var(--hairline);
  background:linear-gradient(178deg,var(--srf-1) 0%,var(--srf-2) 62%,var(--srf-3) 100%);
  box-shadow:var(--c2-shadow);transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease}
.card2::before{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}
html.light .card2::before{background:linear-gradient(90deg,transparent,#FFFFFF,transparent)}
.card2::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(133deg,rgba(255,255,255,.045),transparent 34%)}
html.light .card2::after{background:linear-gradient(133deg,rgba(255,255,255,.6),transparent 38%)}
.card2:hover{border-color:var(--hairline-2);transform:translateY(-1px)}
.card2.sel{border-color:rgba(88,166,255,.62);
  box-shadow:0 0 0 1px rgba(88,166,255,.30),0 0 30px rgba(88,166,255,.16),var(--c2-shadow)}
.card2.sel::before{left:0;right:0;background:linear-gradient(90deg,transparent,rgba(88,166,255,.9),transparent)}
.card2 .grip{position:absolute;width:9px;height:9px;border-radius:2px;background:#0C1117;border:1px solid rgba(88,166,255,.85);z-index:6;box-shadow:0 0 8px rgba(88,166,255,.4)}
.card2 .grip.tl{left:-4px;top:-4px}.card2 .grip.tr{right:-4px;top:-4px}.card2 .grip.bl{left:-4px;bottom:-4px}.card2 .grip.br{right:-4px;bottom:-4px}
.c2-head{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--hairline);position:relative;z-index:2}
.c2-ico{width:19px;height:19px;flex:0 0 19px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text1);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--hairline)}
.c2-ico svg{width:11px;height:11px}
.c2-title{font-size:12px;font-weight:650;letter-spacing:.1px;white-space:nowrap}
.c2-sub{font-size:9px;color:var(--text2);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.c2-body{position:relative;z-index:2;flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
/* hero */
.hero2-top{display:flex;align-items:center;gap:10px}
.hb-ico{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent);
  background:radial-gradient(120% 120% at 30% 20%,rgba(88,166,255,.22),rgba(88,166,255,.05));border:1px solid rgba(88,166,255,.28);box-shadow:0 0 20px rgba(88,166,255,.10)}
.hb-ico svg{width:20px;height:20px}
.h-name{font-size:14.5px;font-weight:650;letter-spacing:.2px}
.h-meta{font-size:9px;color:var(--text2);font-family:var(--font-mono);margin-top:2px}
.chain{display:flex;flex-direction:column;gap:5px}
.chain-row{display:flex;align-items:center;gap:7px;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--hairline);
  background:rgba(255,255,255,.025);font-size:10px}
html.light .chain-row{background:rgba(31,35,41,.025)}
.chain-row .d{width:5px;height:5px;border-radius:50%;flex:0 0 5px;box-shadow:0 0 7px currentColor}
.chain-row .l{color:var(--text2);min-width:34px;font-size:9px}
.chain-row .v{font-family:var(--font-mono);color:var(--text1);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain-row .r{margin-left:auto;color:var(--ok);font-size:9px}
.hero2-foot{margin-top:auto;display:flex;align-items:center;gap:8px;border-top:1px dashed var(--hairline);padding-top:8px;font-size:9px;color:var(--text2);font-family:var(--font-mono)}
.hero2-foot .mono{color:var(--text1)}
/* gauges */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.gauge-semi{position:relative;display:flex;justify-content:center;width:210px;max-width:100%}
.gauge-semi svg{width:100%;height:auto}
.gs-val{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--font-mono);font-weight:600;font-size:30px;letter-spacing:-1.5px;line-height:1;color:var(--text0)}
.gs-val span{font-size:11px;color:var(--text2);margin-left:2px;letter-spacing:0}
.gs-val em{font-style:normal;font-size:11px;color:var(--text2);display:block;letter-spacing:.12em;margin-top:5px;font-weight:500}
.g-sm .gs-val{font-size:23px;bottom:13px}
.g-sm .gs-val em{font-size:10px;margin-top:3px}
.g-legend{display:flex;align-items:center;justify-content:center;gap:10px;font-size:8.5px;color:var(--text2);font-family:var(--font-mono);flex-wrap:wrap}
.g-legend i{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:4px;box-shadow:0 0 6px currentColor}
.gfoot{display:flex;justify-content:space-between;width:100%;font-size:8.5px;color:var(--text2);font-family:var(--font-mono);padding:0 4px}
.gfoot b{color:var(--text1);font-weight:500}
/* rings */
.rings{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-around;gap:4px}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:7px}
.ring-wrap{position:relative;width:88px;height:88px}
.ring-wrap svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:32px;font-family:var(--font-mono);font-weight:600;font-size:17px;letter-spacing:-.5px}
.ring-center span{font-size:8px;color:var(--text2);margin-left:1px}
.ring-name{font-size:8.5px;color:var(--text2);font-family:var(--font-mono);letter-spacing:.03em}
.ring-foot{font-size:8.5px;color:var(--text2);font-family:var(--font-mono);text-align:center;border-top:1px dashed var(--hairline);padding-top:7px;margin-top:auto}

.bm{display:flex;flex-direction:column;gap:4px}
.bm-head{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text1)}

.bm-track{display:flex;gap:2px;height:9px}
.bm-track i{flex:1;border-radius:1.5px;background:var(--track)}
.bm-track i.on{background:var(--c);box-shadow:0 0 6px rgba(88,166,255,.18)}
.bm-sub{display:flex;justify-content:space-between;font-size:8px;color:var(--text2);font-family:var(--font-mono)}
/* amplitude */
.amp{flex:1;min-height:0;display:flex;align-items:flex-end;gap:2px;padding:2px 0}
.amp i{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--c),transparent);opacity:.85}
.amp i:nth-child(3n){opacity:.45}
.amp-m{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.amp-m .top,.amp-m .bot{flex:1;min-height:0;display:flex;align-items:flex-end;gap:2px}

.xaxis{display:flex;justify-content:space-between;font-size:8px;color:var(--text2);font-family:var(--font-mono);padding:0 2px}

.tgl.on{background:rgba(88,166,255,.30);border-color:rgba(88,166,255,.55);box-shadow:0 0 12px rgba(88,166,255,.18)}

.slider2 .fi{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#7EE787);box-shadow:0 0 10px rgba(88,166,255,.35)}
.slider2 .kn{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;margin-left:-7px;border-radius:50%;background:#EAF2FF;border:1px solid rgba(88,166,255,.8);box-shadow:0 0 10px rgba(88,166,255,.6)}

.ctl-row{display:flex;align-items:center;gap:8px}

.reg-addr{font-family:var(--font-mono);font-size:9px;color:var(--text2)}
.reg-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}

.reg-foot{display:flex;align-items:center;gap:8px;font-size:8.5px;color:var(--text2);font-family:var(--font-mono)}

.ds-row:last-child{border-bottom:0}
.ds-row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-row .v{font-family:var(--font-mono);font-size:8.5px;color:var(--text2)}
.ds-bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;min-width:36px}
.ds-bar i{display:block;height:100%;background:var(--accent)}

.deck-hint{position:absolute;right:22px;bottom:20px;display:flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;
  border:1px solid var(--hairline-2);background:rgba(10,14,20,.72);font-size:9px;color:var(--text2);font-family:var(--font-mono);z-index:8}
html.light .deck-hint{background:rgba(255,255,255,.82)}

.hero2-kv{display:flex;flex-direction:column;margin-top:1px}
.kvline{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed rgba(255,255,255,.07);font-size:9.5px;color:var(--text2);min-width:0}
html.light .kvline{border-top-color:rgba(31,35,41,.08)}
.kvline b{font-family:var(--font-mono);font-weight:500;color:var(--text0);font-size:9.5px;margin-left:auto;white-space:nowrap}

  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".28"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    (fill ? '<path d="' + area + '" fill="url(#' + id + ')"/>' : '') +
    '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
    '</svg>';
}
function multichart(seriesList, colors, w, h) {
  const all = seriesList.reduce((a, s) => a.concat(s), []);
  const min = Math.min(...all), max = Math.max(...all), pad = (max - min) * 0.18 || 1;
  const lo = min - pad, hi = max + pad;
  const X = (n, i) => 12 + i * (w - 24) / (n - 1);
  const Y = v => h - 12 - ((v - lo) / (hi - lo)) * (h - 24);
  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const y = (12 + i * (h - 24) / 3).toFixed(1);
    grid += '<line x1="12" x2="' + (w - 12) + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" stroke-opacity=".08" stroke-width="1" stroke-dasharray="2 4"/>';
  }
  let body = '';
  seriesList.forEach((vals, si) => {
    const d = vals.map((v, i) => (i ? ' L ' : 'M ') + X(vals.length, i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
    if (si === 0) {
      const area = d + ' L ' + X(vals.length, vals.length - 1).toFixed(1) + ' ' + (h - 6) + ' L ' + X(vals.length, 0).toFixed(1) + ' ' + (h - 6) + ' Z';
      const id = 'g' + (++uid);
      body += '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + colors[si] + '" stop-opacity=".24"/><stop offset="1" stop-color="' + colors[si] + '" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#' + id + ')"/>';
    }
    body += '<path d="' + d + '" fill="none" stroke="' + colors[si] + '" stroke-width="' + (si === 0 ? '1.7' : '1.4') + '" opacity="' + (si === 0 ? '1' : '.72') + '" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' + grid + body + '</svg>';
}

function polarPt(cx, cy, r, deg) {
  const a = deg * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcD(cx, cy, r, a0, a1) {
  const p0 = polarPt(cx, cy, r, a0), p1 = polarPt(cx, cy, r, a1);
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return 'M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
}
function gaugeSemi(pct, color, opts) {
  opts = opts || {};
  const W = 210, H = 126, cx = 105, cy = 104, r = 78;
  const zid = 'z' + (++uid);
  const a1 = 180 + 180 * Math.min(99.5, Math.max(0, pct)) / 100;
  const np = polarPt(cx, cy, r - 5, a1);
  let ticks = '';
  for (let i = 0; i <= 10; i++) {
    const a = 180 + i * 18;
    const p0 = polarPt(cx, cy, r + 4, a), p1 = polarPt(cx, cy, r + (i % 5 === 0 ? 12 : 8), a);
    ticks += '<line x1="' + p0[0].toFixed(1) + '" y1="' + p0[1].toFixed(1) + '" x2="' + p1[0].toFixed(1) + '" y2="' + p1[1].toFixed(1) + '" style="stroke:rgba(255,255,255,.16)" stroke-width="1"/>';
  }
  let zones = '';
  if (opts.zones) {
    zones = '<defs><linearGradient id="' + zid + '" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0" stop-color="#3FB950"/><stop offset=".55" stop-color="#7EE787"/>' +
      '<stop offset=".74" stop-color="#D29922"/><stop offset="1" stop-color="#F85149"/></linearGradient></defs>' +
      '<path d="' + arcD(cx, cy, r, 180, 360) + '" fill="none" style="stroke:url(#' + zid + ')" stroke-width="9" stroke-linecap="round" opacity=".40"/>';
  }
  let thr = '';
  if (opts.threshold) {
    const a = 180 + 180 * opts.threshold / 100;
    const p0 = polarPt(cx, cy, r - 4, a), p1 = polarPt(cx, cy, r + 10, a);
    thr = '<line x1="' + p0[0].toFixed(1) + '" y1="' + p0[1].toFixed(1) + '" x2="' + p1[0].toFixed(1) + '" y2="' + p1[1].toFixed(1) + '" style="stroke:#F85149" stroke-width="1.2" stroke-dasharray="2 2"/>';
  }
  return '<div class="gauge-semi">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '">' + zones +
      (opts.zones ? '' : '<path d="' + arcD(cx, cy, r, 180, 360) + '" fill="none" style="stroke:var(--track)" stroke-width="9" stroke-linecap="round"/>') +
      '<path d="' + arcD(cx, cy, r, 180, a1) + '" fill="none" style="stroke:' + color + ';filter:drop-shadow(0 0 7px ' + color + ')" stroke-width="9" stroke-linecap="round"/>' +
      ticks + thr +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + np[0].toFixed(1) + '" y2="' + np[1].toFixed(1) + '" style="stroke:' + color + '" stroke-width="1.6" opacity=".9"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="3" style="fill:' + color + ';filter:drop-shadow(0 0 6px ' + color + ')"/>' +
    '</svg>' +
    '<div class="gs-val">' + (opts.value !== undefined ? opts.value : pct) + '<span>' + (opts.unit || '') + '</span>' +
      (opts.label ? '<em>' + opts.label + '</em>' : '') + '</div>' +
  '</div>';
}
function ringGauge(pct, color, name, sub) {
  const C = 2 * Math.PI * 36, dash = C * pct / 100;

    '</svg><div class="ring-center">' + pct.toFixed(1) + '<span>%</span></div></div>' +

}

    '<span class="p">&gt;</span> cat /proc/loadavg',
    '0.42 0.38 0.31 2/318 9412',
    '<span class="p">&gt;</span> <span style="opacity:.5">_</span>'
  ].map(l => '<div>' + l + '</div>').join('');
  const dock = '<div class="dock"><div class="dock-grip"><i></i></div>' +
    '<div class="dock-tabs">' +
      '<button class="dock-tab on">' + icon('terminal', 12) + '终端 · adb shell</button>' +
      '<button class="dock-tab">' + icon('folder', 12) + '文件传输</button>' +
      '<button class="dock-tab">' + icon('list', 12) + '运行日志</button>' +
      '<span class="dock-sp"><span class="led" style="width:5px;height:5px;flex:0 0 5px;box-shadow:none"></span>adb · usb0 · 18ms · pty 已连接</span>' +
      '<button class="ghostbtn">' + icon('plus', 12) + '</button><button class="ghostbtn">' + icon('pause', 12) + '</button>' +
    '</div>' +
    '<div class="dock-body"><div class="dock-term">' + term + '</div>' +
      '<div class="dock-side">' +
        '<div><div class="ds-cap">传输队列 · 1</div><div class="ds-row"><span class="n">model_rknn.rknn</span><span class="ds-bar"><i style="width:62%"></i></span><span class="v">62%</span></div>' +
          '<div class="ds-row"><span class="n">至 /opt/demo · 12.4 MB/s</span><span class="v">24.1 MB</span></div></div>' +
        '<div><div class="ds-cap">待确认动作 · 1</div><div class="ds-row"><span class="n">cpu.governor.set · performance</span><span class="v" style="color:var(--warn)">待确认</span></div>' +
          '<div class="ds-row"><span class="n">guard 0–7 · 写后回读 cpu.usage</span><span class="v">5 min 有效</span></div></div>' +
        '<div><div class="ds-cap">回读</div><div class="ds-row"><span class="n">最近动作回读一致</span><span class="v" style="color:var(--ok)">✓ 12:01:41</span></div></div>' +
      '</div></div></div>';
  return v2Shell('<main class="main"><div class="deck">' + v2Tabs('调试') +
    '<div class="debug-main"><div class="debug-grid">' + cards + '</div>' + dock + '</div></div></main>', 'dashboard');
}

function render() {
  const hash = (location.hash || '#overview2-dark').replace('#', '');
  const isLight = hash.endsWith('-light');
  document.documentElement.className = isLight ? 'light' : '';
  let html = '';
  if (hash === 'library-dark') html = library();
  else if (hash === 'consent-dark') html = consentScreen();
  else if (hash === 'overview2-dark' || hash === 'overview2-light') html = deckOverview();
  else if (hash === 'monitor2-dark' || hash === 'monitor2-light') html = deckMonitor();
  else if (hash === 'debug2-dark' || hash === 'debug2-light') html = deckDebug();
  else html = dashboard();
  document.getElementById('app').innerHTML = html;
}
window.addEventListener('hashchange', render);
render();
</script>

html.light #demo-nav button.on{background:#EAF1FF;color:#3370FF;box-shadow:inset 0 0 0 1px #BFD4FF}
</style>
<script>
(function(){
  var items = [['总览·暗','overview2-dark'],['总览·浅','overview2-light'],['监控·暗','monitor2-dark'],['调试·暗','debug2-dark']];
  var nav = document.createElement('div'); nav.id = 'demo-nav';
  var cap = document.createElement('b'); cap.textContent = 'DSH · 示例'; nav.appendChild(cap);
  var btns = {};
  items.forEach(function(it){
    var el = document.createElement('button');
    el.textContent = it[0];
    el.onclick = function(){ location.hash = it[1]; };
    nav.appendChild(el); btns[it[1]] = el;
  });
  document.body.appendChild(nav);
  function sync(){
    var h = (location.hash || '#overview2-dark').replace('#','');
    Object.keys(btns).forEach(function(k){ btns[k].classList.toggle('on', k === h); });
  }
  sync();
  window.addEventListener('hashchange', sync);
  if(!location.hash) history.replaceState(null, '', '#overview2-dark');
})();
</script>
