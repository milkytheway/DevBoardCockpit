# 板型 profile：ATK-DLRK3588
#
# 它回答：这个板子有哪些语义位号、每个位号怎么产生、有哪些可写的动作。
# 它不回答「怎么连」——那是 ../targets/*.json 的事（见 README.md）。
#
# 模型（见 docs/04-架构设计.md §4.2、§6）：
#   recipes —— 读取配方：这台板上「怎么把东西读出来」（一条命令，不写脚本）
#   tags    —— 语义位号：指向一个 recipe + 一个通用提取器 + 单位
#   actions —— 可写动作：命令模板 + 分级 + 回读哪个位号
#
# 配方必须能压成**单行**（串口一次只能跑一行，见 docs/02-设备事实清单.md S6）。
#
# status: draft —— 已对着真板核过一遍路径与格式，但整体尚未走 smoke:board 全量断言。
# 走完 `npm run smoke:board -- --profile atklrk3588` 之后才改成 verified。

id: atklrk3588
label: ATK-DLRK3588
version: 1
status: draft

identity:
  compatible:
    - rockchip,rk3588-evb7-lp4-v10
    - rockchip,rk3588
  os: Buildroot 2024.02
  rootfs_version: g06c38152
  kernel: 6.1.141
  init: busybox + eudev            # 无 systemd
  cpu:
    cores: 8
    clusters:
      A55: 4                       # CPU part 0xd05
      A76: 4                       # CPU part 0xd0b
  memory_kb: 8107744

# ── 读取配方 ────────────────────────────────────────────────────────
# planner 会把本次需要的配方合并成**一条**命令执行（一次往返，见事实 A5/A6）
recipes:
  stat:
    run: "cat /proc/stat"
  cpuinfo:
    run: "grep -E 'processor|CPU part' /proc/cpuinfo"
  gpu_devfreq:
    run: "cat /sys/class/devfreq/fb000000.gpu/load 2>/dev/null"
  gpu_governor:
    run: "cat /sys/class/devfreq/fb000000.gpu/governor 2>/dev/null"
  npu_load:
    run: "cat /sys/kernel/debug/rknpu/load 2>/dev/null"
  npu_devfreq:
    run: "cat /sys/class/devfreq/fdab0000.npu/load 2>/dev/null"
  npu_governor:
    run: "cat /sys/class/devfreq/fdab0000.npu/governor 2>/dev/null"
  meminfo:
    run: "grep -E 'MemTotal|MemAvailable' /proc/meminfo"
  thermal:
    run: "for z in /sys/class/thermal/thermal_zone*; do echo \"$(cat $z/type 2>/dev/null)=$(cat $z/temp 2>/dev/null)\"; done"
  backlight0:
    run: "cat /sys/class/backlight/backlight0/brightness 2>/dev/null"
  backlight1:
    run: "cat /sys/class/backlight/backlight1/brightness 2>/dev/null"
  cpu_governor:
    run: "cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null"

# ── 语义位号（板 → GUI）──────────────────────────────────────────────
tags:
  cpu.usage:
    recipe: stat
    extract: proc_stat_total
    unit: percent
    sampling: interval
    interval_ms: 1000
    description: 整机 CPU 使用率（busy = total - idle）

  cpu.core.usage:
    recipe: stat
    extract: proc_stat_cores
    unit: percent
    sampling: interval
    interval_ms: 1000
    description: 每核使用率；核编号取 cpuN 的 N

  cpu.cluster:
    recipe: cpuinfo
    extract: cpuinfo_part
    unit: text
    map:
      "0xd05": A55
      "0xd0b": A76
    sampling: onDemand

  gpu.utilization:
    recipe: gpu_devfreq
    extract: devfreq_percent
    unit: percent
    sampling: interval
    interval_ms: 1000

  gpu.frequency:
    recipe: gpu_devfreq
    extract: devfreq_hertz
    unit: hertz
    sampling: interval
    interval_ms: 1000

  gpu.governor:
    recipe: gpu_governor
    extract: file_text
    unit: text
    sampling: onDemand

  npu.utilization:
    recipe: npu_load
    extract: rknpu_load
    unit: percent
    aggregate: max
    sampling: interval
    interval_ms: 1000
    requires: [debugfs]
    description: 真负载；实测 3 个 NPU 核

  npu.duty:
    recipe: npu_devfreq
    extract: devfreq_percent
    unit: percent
    sampling: interval
    interval_ms: 1000
    warning: 这是时钟占空比，不是利用率；空闲时读数就是 100

  npu.governor:
    recipe: npu_governor
    extract: file_text
    unit: text
    sampling: onDemand
    note: 该节点的 available_governors 是 rkdevfreq 的全局列表，不是 NPU 专属

  memory.total:
    recipe: meminfo
    extract: meminfo_value
    key: MemTotal
    unit: kibibyte
    sampling: interval
    interval_ms: 2000

  memory.available:
    recipe: meminfo
    extract: meminfo_value
    key: MemAvailable
    unit: kibibyte
    sampling: interval
    interval_ms: 2000

  memory.used:
    recipe: meminfo
    extract: meminfo_value
    key: MemTotal
    unit: kibibyte
    derive: total - available
    sampling: interval
    interval_ms: 2000

  soc.temperature:
    recipe: thermal
    extract: thermal_zone
    key: soc-thermal
    unit: celsius
    scale: 0.001
    sampling: interval
    interval_ms: 2000

  gpu.temperature:
    recipe: thermal
    extract: thermal_zone
    key: gpu-thermal
    unit: celsius
    scale: 0.001
    sampling: interval
    interval_ms: 2000

  npu.temperature:
    recipe: thermal
    extract: thermal_zone
    key: npu-thermal
    unit: celsius
    scale: 0.001
    sampling: interval
    interval_ms: 2000

  backlight.0.brightness:
    recipe: backlight0
    extract: file_number
    unit: level
    max: 255
    observed: 200
    sampling: onDemand

  backlight.1.brightness:
    recipe: backlight1
    extract: file_number
    unit: level
    max: 255
    observed: 255
    sampling: onDemand

  cpu.governor:
    recipe: cpu_governor
    extract: file_text
    unit: text
    enum: [interactive, conservative, ondemand, userspace, powersave, performance, schedutil]
    observed: schedutil
    sampling: onDemand

# ── 控制动作（GUI → 板）──────────────────────────────────────────────
# tier: read | reversible | destructive
# verify: 写完之后回读哪个位号 —— **UI 的显示依据是回读值**，不是退出码
actions:
  - id: backlight.set
    tier: reversible
    description: 设置背光亮度
    params:
      - name: path
        type: enum
        values:
          - /sys/class/backlight/backlight0/brightness
          - /sys/class/backlight/backlight1/brightness
      - name: value
        type: integer
        min: 0
        max: 255
    command: "echo {value} > {path}"
    verify:
      tag: backlight.0.brightness
    verify_note: 目标是哪个背光就回读哪个；实现时按 path 推导 tag

  - id: cpu.governor.set
    tier: reversible
    description: 设置 CPU 调频策略
    params:
      - name: governor
        type: enum
        values: [interactive, conservative, ondemand, userspace, powersave, performance, schedutil]
    command: "echo {governor} > /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor"
    verify:
      tag: cpu.governor

  - id: npu.governor.set
    tier: reversible
    description: 设置 NPU 调频策略
    params:
      - name: governor
        type: enum
        values: [rknpu_ondemand, simple_ondemand, userspace, powersave, performance]
    command: "echo {governor} > /sys/class/devfreq/fdab0000.npu/governor"
    verify:
      tag: npu.governor

  - id: debugfs.mount
    tier: reversible
    description: 挂载 debugfs（npu.utilization 的前置条件）
    command: "mount -t debugfs debugfs /sys/kernel/debug"
    verify:
      tag: npu.utilization
    note: 挂载后要重新采样；读不到时位号应是 unknown 而不是 0

  - id: system.reboot
    tier: destructive
    description: 重启板子
    command: "reboot"
    requires_confirm: true

# ── 逃生门 ────────────────────────────────────────────────────────────
# 词汇表不够用时，允许板型自己声明额外位号，一律带 custom. 前缀。
custom_tags: {}