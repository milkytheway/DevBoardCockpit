# Board pack for the ATK-DLRK3588.
#
# Every path in this pack comes from the measurements recorded in
# core/metrics.py. The "Hardware metrics" section of its README states that
# all of them were verified on an RK3588 board running Linux 6.1.141.
#
# Two known traps are encoded explicitly here:
#   1. The NPU devfreq load file reads 100@1000000000Hz, which is a duty
#      cycle rather than a utilisation. npu.usage therefore binds to the
#      rknpu_load reading and not to devfreq.
#   2. thermal_zone5 is the index of one particular board and cannot be
#      hard-coded. The pack walks the directory with a glob and merges the
#      entries by their type file.
#
# Verify with `npm run validate:profiles` for the pack itself and
# `npm run probe:board -- --profile board-adb` to probe a real board.

apiVersion: devboard/v1
kind: BoardPack

id: rk3588-atk
name: ATK-DLRK3588 (Alientek)
version: 1.0.0
description: RK3588, Buildroot 6.1.141, 8 cores (Cortex-A55 x4 + Cortex-A76 x4)

requires:
  transports: [adb, serial, ssh]
  # Board-level capabilities (closed vocabulary, contract spec/02 section 10.3).
  #
  # `stream` is deliberately absent: the contract for Stream is not settled
  # (spec/00 section 7), so declaring it would not be honoured. Validation
  # rule 26 rejects it as an error. Add it back once the Stream contract
  # lands and rule 26 lists it as implemented.
  capabilities: [shell, exec, files]
  min_contract: devboard/v1

# Version of the danger floor table (contract spec/02 section 5.2.1). The
# floor belongs to the contract rather than to the pack; what is declared
# here is which revision of the floor this pack was written against. The
# version 1 table is in spec/02.
danger_floor_version: 1

# Automatic detection. When a connection does not name a board pack, the
# runtime reads the board model and matches it against these rules.
# mode: exact means the model string must be identical; substring means it
# must contain one of them.
match:
  mode: substring
  models:
    - ATK-DLRK3588

# ── Poll groups ─────────────────────────────────────────────────────────────
# One group = one round trip: all readers of the same group are combined into
# a single command and fetched in one go.
#
# Why not put every reader in one group: `/proc/stat` has to be sampled once
# a second (the utilisation is the difference of two samples), while
# `/proc/device-tree/model` does not change within a day. Combining them into
# one command means the model is re-read every second as well, which wastes
# the 30ms of the fork, and the CPU time of the forked shell itself lands in
# `/proc/stat` and makes the board look 100% busy.
#
# Why not have one group holding everything: the measured 30ms above is the
# reason.
poll_groups:
  - id: fast
    interval_ms: 1000
    readers: [cpu, gpu, npu]

  - id: slow
    interval_ms: 2000
    readers: [mem, temp, cpu_governor]

  - id: rare
    interval_ms: 30000
    readers: [board, npu_devfreq, npu_freq, backlight, backlight1]

# ── Data sources ─────────────────────────────────────────────────────────────
readers:
  - id: cpu
    kind: proc_stat
    args:
      stat_path: /proc/stat
      cpuinfo_path: /proc/cpuinfo
    provides:
      - tag: cpu.usage
        sample: usage
      - tag: cpu.core.*.usage
        sample: core.*.usage
      - tag: cpu.core.*.cluster
        sample: core.*.cluster

  - id: gpu
    kind: devfreq_load
    args:
      path: /sys/class/devfreq/fb000000.gpu/load
      # Reads out as "37@3000000000Hz". The GPU devfreq load of an RK really
      # is a utilisation, unlike the NPU one (see the npu reader below), so
      # it has to be declared here.
      measure: utilization
    provides:
      - tag: gpu.usage
        sample: duty
      - tag: gpu.freq_hz
        sample: freq_hz

  - id: npu
    kind: rknpu_load
    args:
      # The real NPU utilisation is here, not in the devfreq load file.
      # debugfs is mounted by default on this board (measured 2026-11-13:
      # /proc/mounts carries a debugfs line), but the mount is not
      # persistent: it can be gone after a reboot (it depends on the board's
      # fstab and init scripts).
      # When it cannot be read, npu.usage reports unavailable. It must not
      # fall back to the devfreq duty cycle, which would show 100% while the
      # board is idle.
      path: /sys/kernel/debug/rknpu/load
    provides:
      - tag: npu.usage
        sample: usage
      - tag: npu.core.*.usage
        sample: core.*.usage

  - id: mem
    kind: meminfo
    args:
      path: /proc/meminfo
    provides:
      - tag: mem.total_bytes
        sample: total_bytes
      - tag: mem.available_bytes
        sample: available_bytes
      - tag: mem.used_bytes
        sample: used_bytes
      - tag: mem.usage
        sample: usage

  - id: temp
    kind: thermal_zone
    args:
      glob: /sys/class/thermal/thermal_zone*
      # Merge by the name in the type file, without relying on the zone
      # index.
      type_map:
        soc-thermal: soc
        gpu-thermal: gpu
        npu-thermal: npu
    provides:
      - tag: temp.soc
        sample: zone.soc
      - tag: temp.gpu
        sample: zone.gpu
      - tag: temp.npu
        sample: zone.npu

  - id: cpu_governor
    kind: file_read
    args:
      path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
      format: string
      strip_trailing_null: true
    provides:
      - tag: cpu.governor
        sample: value

  - id: board
    kind: file_read
    args:
      path: /proc/device-tree/model
      format: string
      strip_trailing_null: true
    provides:
      - tag: board.model
        sample: value

# ── Control surface ─────────────────────────────────────────────────────────
actions:
  - id: backlight.set
    label: Set the backlight brightness
    danger: reversible
    params:
      value:
        type: integer
        min: 0
        max: 255
    # Parameter range (contract spec/02 section 5.5): 0-15 is so dark that
    # the screen looks broken, so it falls outside the "gentle" range and
    # needs a confirmation of its own. The guard can only narrow the range,
    # never widen it.
    guard:
      value: {min: 16, max: 255}
    command: "echo {value} > /sys/class/backlight/backlight/brightness"
    readback:
      kind: file_equals
      path: /sys/class/backlight/backlight/brightness
      expect: "{value}"
      tolerance: 1

  - id: system.reboot
    label: Reboot the board
    danger: destructive
    params: {}
    command: "reboot"
    readback:
      # The reboot command returning 0 only says the shell accepted it, not
      # that the board really rebooted.
      # verify is the second check that runs after the action: wait for the
      # board to come back and see that the uptime changed.
      kind: verify
      command: "uptime -s"
      timeout_ms: 60000

  - id: cpu.governor.set
    label: Set the CPU frequency governor
    danger: reversible
    params:
      governor:
        type: enum
        # Measured available values (docs/02 section 3.1): interactive
        # conservative ondemand userspace powersave performance schedutil
        values: [performance, schedutil, powersave, ondemand, userspace, interactive, conservative]
      cpu:
        type: integer
        min: 0
        max: 7
        default: 0
    command: "echo {governor} > /sys/devices/system/cpu/cpu{cpu}/cpufreq/scaling_governor"
    readback:
      kind: file_equals
      path: /sys/devices/system/cpu/cpu{cpu}/cpufreq/scaling_governor
      expect: "{governor}"

  # ── Meta operations (added 2026-11-16) ────────────────────────────────────
  #
  # Where this batch comes from: the functional test matrix of chapter 2 of
  # the Alientek "ATK-DLRK3588 Buildroot System Quick Start Manual V1.0",
  # plus a measurement of every one of them on the real board on 2026-11-16.
  #
  # The rules (contract spec/02 section 4):
  #   Every action has to declare how it is read back (validation rule 27):
  #   "the command was sent" is not "the board really changed".
  #   There are only two danger levels (reversible / destructive), and every
  #   command on the danger floor (section 5.2) is destructive. None of the
  #   ones below hits the floor.

  - id: led.set
    label: Turn the on-board LED on / off
    danger: reversible
    params:
      value:
        type: integer
        min: 0
        max: 1
        default: 1
    # The trigger has to be set to none first: the factory default is
    # `heartbeat` (manual section 2.1), and writing brightness has no effect
    # while the heartbeat is running (measured 2026-11-16: writing 1 still
    # reads back 0, because the trigger decides the value).
    # - The two steps are written as one command (`&&`, because the host
    #   executor runs through a shell).
    command: "echo none > /sys/class/leds/work/trigger && echo {value} > /sys/class/leds/work/brightness"
    readback:
      kind: file_equals
      path: /sys/class/leds/work/brightness
      expect: "{value}"

  - id: backlight1.set
    label: Set the second backlight brightness
    danger: reversible
    params:
      value:
        type: integer
        min: 0
        max: 255
        default: 255
    # The backlight of the second panel (the MIPI secondary panel or the HDMI
    # panel): the manual only documents the first one, but this board really
    # has a `backlight1` (measured).
    command: "echo {value} > /sys/class/backlight/backlight1/brightness"
    readback:
      kind: file_equals
      path: /sys/class/backlight/backlight1/brightness
      expect: "{value}"

  - id: cpu.governor.set_all
    label: Set the governor of every CPU cluster
    danger: reversible
    params:
      governor:
        type: enum
        # Measured available values (docs/02 section 3.1; on the board read
        # `scaling_available_governors`)
        values: [performance, schedutil, powersave, ondemand, userspace, interactive, conservative]
    # ── Why this one exists (while `cpu.governor.set` covers a single core) ──
    #
    # The RK3588 is policy based (measured 2026-11-16):
    #   policy0 = cores 0-3 (the small A55 cores)
    #   policy4 = cores 4-5 (the big A76 cores)
    #   policy6 = cores 6-7 (the big A76 cores)
    # and `cpu{cpu}/cpufreq` is a symlink pointing at a policy (measured), so
    # writing cpu0 actually writes policy0, which covers only 4 cores.
    # Manual section 2.17 says explicitly that "all cores are recommended to
    # be enabled", so setting a single core is not enough.
    command: "for p in policy0 policy4 policy6; do echo {governor} > /sys/devices/system/cpu/cpufreq/$p/scaling_governor; done"
    readback:
      # All three have to match: `grep -q` over several files returns 0 as
      # soon as one of them matches, so the three are chained with `grep -qx`
      # (whole line match).
      kind: verify
      command: "grep -qx {governor} /sys/devices/system/cpu/cpufreq/policy0/scaling_governor && grep -qx {governor} /sys/devices/system/cpu/cpufreq/policy4/scaling_governor && grep -qx {governor} /sys/devices/system/cpu/cpufreq/policy6/scaling_governor"
      timeout_ms: 10000

  - id: network.iface.set
    label: Network interface up / down
    danger: reversible
    params:
      iface:
        type: enum
        # Interfaces that exist as measured (2026-11-16): eth0 / eth1 / can0
        # / wlan0 / wlan1
        values: [eth0, eth1, can0, wlan0, wlan1]
      state:
        type: enum
        values: [up, down]
    # eth0 is the line the host uses to reach the board: once it is down the
    # host has lost the board.
    # - That is the user's choice (this row can be switched off in the
    #   permission area).
    # - The readback still has to read for real: with the line down there is
    #   nothing to read, so the step fails, which is honest.
    command: "ip link set {iface} {state}"
    readback:
      kind: verify
      # `ip -br link` prints UP / DOWN in upper case, so the match needs `-i`
      # (measured).
      command: "ip -br link show {iface} | grep -qi {state}"
      timeout_ms: 10000

  - id: can.up
    label: Enable the CAN interface
    danger: reversible
    params:
      bitrate:
        type: integer
        # Manual section 2.20: CAN is usually 1k~1M, the common values are
        # 500k / 250k / 125k / 100k / 50k
        min: 50000
        max: 1000000
        default: 1000000
    # Down first, then up: changing the bitrate while the interface is
    # already up reports `RTNETLINK answers: File exists` (measured), so this
    # action has to be repeatable.
    command: "ip link set can0 down 2>/dev/null; ip link set can0 up type can bitrate {bitrate}"
    readback:
      kind: verify
      # The exact bitrate cannot be checked: the board reports
      # `bitrate 990000` (the driver divides the crystal frequency, so 1M can
      # only come out as 990000), so the check is only that a bitrate is
      # there at all.
      command: "ip -details link show can0 | grep -q bitrate"
      timeout_ms: 10000

  - id: sysclock.set
    label: Set the system time
    danger: reversible
    params:
      timestamp:
        type: string
        # The shape `date -s` expects: `YYYY-MM-DD HH:MM:SS`
        maxLength: 32
        default: "1970-01-01 00:00:00"
    # ── Why this is a real requirement on a real board ──
    #
    # Measured 2026-11-16: the system time of the board is 1970-01-01,
    # because the RTC cannot be read (`hwclock` reports
    # `RTC_RD_TIME: Invalid argument`) and the factory system runs no NTP
    # (the manual says it only synchronises once a network cable is plugged
    # in). Without setting the time, every log timestamp on the board is
    # from 1970.
    # - This step is the one that makes the board's time right.
    #
    # The format is filled in by the user: the app never guesses "what time
    # is it now". The host's time is not necessarily right, and the board's
    # time is definitely wrong; when neither is right, the one the person
    # typed is the true one.
    command: "date -s {timestamp}"
    readback:
      kind: verify
      # The placeholder must not carry its own quotes (validation rule 21);
      # the runtime adds them.
      command: "date '+%Y-%m-%d %H:%M:%S' | grep -q {timestamp}"
      timeout_ms: 10000

  - id: audio.play
    label: Play an audio file
    danger: reversible
    params:
      path:
        type: string
        maxLength: 200
        default: /userdata/piano2-CoolEdit.mp3
    # The board has `gst-play-1.0` as measured (manual section 2.7.1), and
    # the default file is the piece that ships with the board (measured:
    # `/userdata/piano2-CoolEdit.mp3`).
    command: "gst-play-1.0 {path}"
    readback:
      # The exit code is the criterion: the playback returns 0 when it has
      # finished (measured).
      kind: command_ok

  - id: audio.record
    label: Record an audio clip
    danger: reversible
    params:
      seconds:
        type: integer
        min: 1
        max: 60
        default: 5
      path:
        type: string
        maxLength: 200
        default: /userdata/record.wav
    # Use the sound card name, not its number: the measured `amixer -c 3`
    # (the number the vendor scripts use) points at hdmi1, and es8388 is
    # card 1, but the numbers change when devices are plugged and unplugged.
    # Use the name `rockchipes8388` (the manual uses the name too, section
    # 2.7.2).
    command: "arecord -D hw:rockchipes8388,0 -c 2 -d {seconds} -f S16_LE -r 48000 {path}"
    readback:
      kind: verify
      # The file is not empty: `test -s` (size > 0). Measured, 3 seconds of
      # recording produced 576044 bytes.
      command: "test -s {path}"
      timeout_ms: 60000

  - id: camera.snapshot
    label: Capture one camera frame
    danger: reversible
    params:
      device:
        type: enum
        # The silkscreen to node mapping of manual section 2.8 (measured: the
        # name of all four nodes is rkisp_mainpath, so the model cannot be
        # recognised and only the silkscreen mapping identifies them).
        values: [/dev/video62, /dev/video71, /dev/video44, /dev/video53]
      path:
        type: string
        maxLength: 200
        default: /userdata/snapshot.jpg
    # The pipeline of manual section 2.8 (measured: with no camera attached
    # it fails honestly with `not-negotiated (-4)` instead of pretending to
    # have succeeded).
    command: "gst-launch-1.0 v4l2src device={device} ! video/x-raw,format=NV12,width=640,height=480,framerate=30/1 ! videoconvert ! jpegenc ! multifilesink location={path}"
    readback:
      # `command_ok` rather than `verify`: the failure of the command itself
      # is the best diagnosis. With no camera attached gst reports
      # `not-negotiated (-4)` (measured), while `verify` (which polls
      # `test -s`) would wait the full 30 seconds and then report "timed out",
      # which hides the real cause.
      # - Let gst speak for itself (its stderr reaches the report).
      # - The "file is not empty" check belongs to the
      #   `camera-capture.capture` assertion at the workflow layer, so the
      #   two layers split the work.
      kind: command_ok

  - id: storage.benchmark
    label: Storage write benchmark
    danger: reversible
    params:
      mountpoint:
        type: enum
        # Mount points as measured (manual section 2.14): the eMMC user
        # partition /userdata, /oem, and the USB disk /mnt/udisk
        values: [/userdata, /oem, /mnt/udisk]
      size_mb:
        type: integer
        min: 1
        max: 512
        default: 50
    # No block device is written: the write goes to a file under the mount
    # point.
    # - That does not hit the danger floor (the floor covers "dd writing to
    #   /dev/mmcblk", validation rule 16).
    # - And `mountpoint` is a closed enumeration, so the user cannot point it
    #   at a block device.
    command: "dd if=/dev/zero of={mountpoint}/.cockpit-bench bs=1024k count={size_mb} conv=fdatasync && rm -f {mountpoint}/.cockpit-bench"
    readback:
      # The command returns 0; a failing `dd` returns non-zero (measured:
      # 235 MB/s writing to the eMMC).
      kind: command_ok

  - id: module.load
    label: Load a kernel module
    danger: reversible
    params:
      name:
        type: string
        maxLength: 64
    # Load by name, not by path (docs/02 section 3.5, rule P2):
    # `insmod /path/x.ko` would pass, but `modprobe x` would not find it.
    # - The module has to be installed into
    #   `/usr/lib/modules/$(uname -r)/extra/` first, then `depmod -a`.
    command: "modprobe {name}"
    readback:
      kind: verify
      # `-w` (whole word), otherwise `hello` would also match `hello_world`.
      command: "lsmod | grep -qw {name}"
      timeout_ms: 30000

  - id: module.unload
    label: Unload a kernel module
    danger: reversible
    params:
      name:
        type: string
        maxLength: 64
    command: "rmmod {name}"
    readback:
      kind: verify
      # The criterion is reversed: the module being absent from `lsmod` is
      # what makes the unload successful.
      command: "! lsmod | grep -qw {name}"
      timeout_ms: 30000

# ── Board-specific quantities ───────────────────────────────────────────────
# They are not in the core vocabulary and other boards are not required to
# have them. The namespace is custom.<pack id>.*
#
# The path below was changed once and then changed back:
#   When the pack was brought in it read /sys/kernel/debug/rknpu/devfreq/cur_freq,
#   but that directory does not exist on the board as measured (under rknpu/
#   there are only delayms, freq, load, power, reset, version and volt).
#   The first revision replaced it with /sys/class/devfreq/fdab0000.npu/load,
#   but the "@<freq>Hz" in that file is "the frequency at which the duty was
#   measured", not the current frequency, so the semantics were being
#   impersonated.
#   The user's decision of 2026-11-12 was to roll back to the path that really
#   means the current frequency.
#
# The three quantities have clean semantics of their own:
#   npu.usage            <- the real utilisation from the rknpu debugfs (0% when idle)
#   custom...npu.duty    <- the clock duty cycle of devfreq (100% when idle)
#   custom...npu.freq_hz <- the current frequency (not the @freq inside the load file)
custom:
  - id: backlight
    kind: file_read
    args:
      path: /sys/class/backlight/backlight/brightness
      format: integer
    provides:
      - tag: custom.rk3588-atk.backlight.brightness
        sample: value

  - id: backlight1
    kind: file_read
    args:
      path: /sys/class/backlight/backlight1/brightness
      format: integer
    provides:
      - tag: custom.rk3588-atk.backlight1.brightness
        sample: value

  - id: npu_devfreq
    kind: devfreq_load
    args:
      path: /sys/class/devfreq/fdab0000.npu/load
      # This one really is a duty cycle, not a utilisation, so it is bound
      # only to a name like .duty and to no *.usage at all. The validator
      # rejects publishing a duty cycle as a utilisation.
      measure: duty_cycle
    provides:
      - tag: custom.rk3588-atk.npu.duty
        sample: duty

  - id: npu_freq
    kind: file_read
    args:
      path: /sys/class/devfreq/fdab0000.npu/cur_freq
      format: integer
    provides:
      - tag: custom.rk3588-atk.npu.freq_hz
        sample: value
