# 通用包 —— **嵌入式 Linux 的「配方」** ✓
#
# ── 它是什么 ──
#
# **一份「一般有什么」的配方** ✓ —— 不是「某块板有什么」✓。
# → 它服务**所有**嵌入式 Linux 板子 ✓ → 一份就够 ✓。
#
# ── 它的用途：**接板向导** ✓（`docs/探索/02-想法一-接板向导.md` ✓）
#
# → 向导拿它**在一块刚接上、还不认识的板子上一条条试** ✓
#   → **试出来的绿/红 = 这块板的真相表** ✓
#   → **真相表 → 实例化出这块板的初版包** ✓（用户目录 ✓）。
#
# ── 为什么它是**一份普通板型包**（而不是新格式）✓ ──
#
# → **白拿四样东西** ✓：
#   **校验器** ✓（规则 28–31 管着「要在陌生板子上跑的命令」✓ —— 这是安全面 ✓）·
#   **探针 machinery** ✓（`probePack` / `judgeReader` / `probeHint` ✓）·
#   **`custom.<id>.` 命名空间** ✓ · **reader kind 的参数 schema** ✓。
#
# ── 为什么它**不写 `match`** ✓ ──
#
# → **不写 `match` 的包永远不参与「这块板用哪个包」的问答** ✓
#   （`matchPack` 第一行就是 `if (match === undefined) return false` ✓）→
#   **它占的是「一份配方」的位置，不是一块板的位置** ✓。
# → 而「**连接指名了某个包**」那条路**根本不看 `match`** ✓ →
#   **向导造一条临时连接、`board_pack` 指名 `generic-linux` → 零新机制** ✓。
#
# ── 它是**只读的** ✓（在应用里）──
#
# → 它是「**要在刚接上的、还不认识的板子上执行的命令集合**」✓
#   → **不该由用户随手改** ✓（改了就是「让宿主在我不认识的机器上跑我改过的命令」✓
#   → 那是**权限区**该管的 ✓ —— 危险动作默认关 ✓）。
# → **用户要改的是「实例化出来的那份」** ✓ —— 每块板的包在用户目录 ✓ —— 那是**产物** ✓。
#
# ── 它说得准与说不准的（**诚实说** ✓）──
#
# | 说得准 ✓ | 说不准 ⚠️ |
# |---|---|
# | **事实** ✓ —— 有没有 ✓ · 几个 ✓ · 什么形状 ✓ | **命名与语义** ⚠️ —— 哪个温区是 SoC ✓ · 那个 duty 是不是利用率 ✓ |
#
# → **后者要知识** ✓ → **那是 agent 的活** ✓（`docs/探索/02` §六 ✓）。
#
# ── ⚠️ **它只给「单个值」的量** ✓（**一条硬边界** ✓）──
#
# → **`file_read` 只有一个 `value` sample** ✓（**不是多实例** ✓）
#   → **所以下面凡是「数量不定」的，一律用 `exec_regex` 取第一行** ✓
#   → **别写成 glob + 一个 tag** ✗ —— 那样多个实例会**挤在一个值里** ✓
#     （实测 2026-11-19：glob 读背光 → `255\n200` 全塞进一个 `value` ✓ → **那是假数** ✗）。
# → **多实例的量**（温区 ✓ · 网卡 ✓）→ 用 `exec_regex` **逐行取** ✓ → **一个 tag 一个值** ✓。

apiVersion: devboard/v1
kind: BoardPack

id: generic-linux
name: 通用嵌入式 Linux（配方）
version: 1.0.0
description: 一份「嵌入式 Linux 一般有什么」的配方。接板向导拿它在一块还不认识的板子上一条条试，试出来的绿/红就是这块板的真相表。

requires:
  transports: [adb, serial, ssh]
  capabilities: [shell, exec]
  min_contract: devboard/v1

# **故意不写 `match`** ✓ —— 见文件头「为什么它不写 match」✓
# → **它不参与自动识别** ✓ → **它不是一块板** ✓ → 它是一份配方 ✓

danger_floor_version: 1

# ── 轮询分组 ─────────────────────────────────────────────────────────────
#
# 一个组 = 一次往返 ✓ —— 同组的所有 reader 合成一条命令 ✓。
#
# **分组按「多久变一次」分** ✓（与 `rk3588-atk` 同款理由 ✓）：
# → `/proc/stat` 每秒都要采 ✓（占用率是两次采样做差 ✓）→ **fast** ✓
# → 内存慢一点 ✓ → **slow** ✓
# → 型号、内核版本**一天不变** ✓ → **rare** ✓
poll_groups:
  - id: fast
    interval_ms: 1000
    readers: [cpu]

  - id: slow
    interval_ms: 2000
    readers: [mem, loadavg1, loadavg5, loadavg15]

  - id: rare
    interval_ms: 30000
    readers: [model, osrelease, kernel, uptime, thermal, backlight, led, net]

# ── 数据源 ─────────────────────────────────────────────────────────────
readers:
  # ── CPU 占用率（**核心词表里的量** ✓）──
  - id: cpu
    kind: proc_stat
    args:
      stat_path: /proc/stat
      cpuinfo_path: /proc/cpuinfo
    provides:
      - tag: cpu.usage
        sample: usage
      - tag: cpu.core.*.usage
        sample: core.*.usage
      - tag: cpu.core.*.cluster
        sample: core.*.cluster

  # ── 内存（**核心词表里的量** ✓）──
  - id: mem
    kind: meminfo
    args:
      path: /proc/meminfo
    provides:
      - tag: mem.total_bytes
        sample: total_bytes
      - tag: mem.available_bytes
        sample: available_bytes
      - tag: mem.used_bytes
        sample: used_bytes
      - tag: mem.usage
        sample: usage

  # ── 负载（**通用** ✓ · **不在核心词表里** → 走 custom 命名空间 ✓）──
  #
  # ⚠️ **`exec_regex` 只取第一个捕获组** ✓ → **一个 reader 一个值** ✓
  # → 所以 1m/5m/15m **要三个 reader** ✓（**不是一个 reader 三个 tag** ✗
  #   （实测 2026-11-19：一个 reader 三个 tag → **三个 tag 拿到同一个值** ✓ → **假数** ✗）。
  - id: loadavg1
    kind: exec_regex
    args:
      command: cat -- /proc/loadavg
      pattern: '^([0-9.]+)\s'
      format: number
    provides:
      - tag: custom.generic-linux.loadavg.1m
        sample: value

  - id: loadavg5
    kind: exec_regex
    args:
      command: cat -- /proc/loadavg
      pattern: '^[0-9.]+\s+([0-9.]+)\s'
      format: number
    provides:
      - tag: custom.generic-linux.loadavg.5m
        sample: value

  - id: loadavg15
    kind: exec_regex
    args:
      command: cat -- /proc/loadavg
      pattern: '^[0-9.]+\s+[0-9.]+\s+([0-9.]+)\s'
      format: number
    provides:
      - tag: custom.generic-linux.loadavg.15m
        sample: value

  # ── 型号（**通用** ✓ · 走 custom ✓）──
  - id: model
    kind: file_read
    args:
      path: /proc/device-tree/model
      strip_trailing_null: true
    provides:
      - tag: custom.generic-linux.board.model
        sample: value

  # ── 系统版本（**通用** ✓ · 走 custom ✓）──
  #
  # ⚠️ **`file_read` 读的是整个文件** ✓ → `/etc/os-release` 是多行 ✓
  # → **一个值里全是行** ✓ → **不实用** ⚠️
  # → **改取 `PRETTY_NAME` 那一行** ✓（实测 2026-11-19 真板有 `PRETTY_NAME="Buildroot 2024.02"` ✓）。
  - id: osrelease
    kind: exec_regex
    args:
      command: cat -- /etc/os-release
      pattern: 'PRETTY_NAME="?([^"\r\n]+)"?'
      format: string
    provides:
      - tag: custom.generic-linux.sys.osrelease
        sample: value

  # ── 内核版本（**通用** ✓ · 走 custom ✓）──
  - id: kernel
    kind: exec_regex
    args:
      command: cat -- /proc/version
      pattern: '^Linux version ([^\s]+)'
      format: string
    provides:
      - tag: custom.generic-linux.sys.kernel
        sample: value

  # ── 开机时长（**通用** ✓ · 走 custom ✓）──
  #
  # ⚠️ `/proc/uptime` 是**两个数** ✓（uptime 秒数 ✓ · idle 秒数 ✓）
  # → **只取第一个** ✓（第二个是 idle ✓ · 对 CPU 占用率**没用** ✓ —— 它已经被 `proc_stat` 算了 ✓）。
  - id: uptime
    kind: exec_regex
    args:
      command: cat -- /proc/uptime
      pattern: '^([0-9.]+)'
      format: number
    provides:
      - tag: custom.generic-linux.sys.uptime_seconds
        sample: value

  # ── 温区（**通用但粗** ✓ —— **哪个是 SoC 说不准** ⚠️ → 那是 agent 的活 ✓）──
  #
  # ⚠️ **这里的 `type_map` 是「猜」的** ✓ —— 通用包**给不出**板子特有的名字 ✓
  # → **粗粒度** ✓ → **实例化时要标成「猜的」** ✓（`provenance.json` ✓）。
  - id: thermal
    kind: thermal_zone
    args:
      glob: /sys/class/thermal/thermal_zone*
      type_map:
        cpu-thermal: soc
        gpu-thermal: gpu
        npu-thermal: npu
    provides:
      - tag: custom.generic-linux.temp.zone.*
        sample: zone.*

  # ── 背光（**通用但数量不定** ✓ → **逐个取** ✓）──
  #
  # ⚠️ **不用 glob** ✓ —— `file_read` 的 glob 会把**多个实例挤进一个值** ✓（假数 ✗）
  # → **取第一个** ✓（**通用包给不出「哪一块屏」** ✓ —— 那是 agent 的活 ✓）。
  - id: backlight
    kind: exec_regex
    args:
      command: cat -- /sys/class/backlight/backlight/brightness 2>/dev/null || cat -- /sys/class/backlight/backlight1/brightness 2>/dev/null
      pattern: '([0-9]+)'
      format: integer
    provides:
      - tag: custom.generic-linux.backlight.brightness
        sample: value

  # ── LED（**通用但数量不定** ✓ → **取第一个** ✓）──
  - id: led
    kind: exec_regex
    args:
      command: cat -- /sys/class/leds/work/brightness 2>/dev/null || cat -- /sys/class/leds/led0/brightness 2>/dev/null
      pattern: '([0-9]+)'
      format: integer
    provides:
      - tag: custom.generic-linux.led.brightness
        sample: value

  # ── 网卡（**通用但数量不定** ✓ → **取第一个** ✓）──
  - id: net
    kind: exec_regex
    args:
      command: cat -- /sys/class/net/*/address 2>/dev/null | tr -d '\n' | cut -d ' ' -f 1
      pattern: '([0-9a-fA-F:]{17})'
      format: string
    provides:
      - tag: custom.generic-linux.net.mac
        sample: value

# ── 板型私有能力（**走 custom 命名空间** ✓）────────────────────────────
custom: []
