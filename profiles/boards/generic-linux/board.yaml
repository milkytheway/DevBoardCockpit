# Generic pack — the "recipe" for embedded Linux
#
# ── What it is ──
#
# A recipe of "what embedded Linux usually has", not of "what a particular
# board has".
# - It serves every embedded Linux board, so one pack is enough.
#
# ── Its purpose: the board onboarding wizard ──
#
# - The wizard runs through it command by command on a board that has just
#   been connected and is not recognised yet.
#   - The green and red results are that board's truth table.
#   - The truth table is then instantiated into the first version of that
#     board's pack (in the user directory).
#
# ── Why it is an ordinary board pack rather than a new format ──
#
# - It gets four things for free:
#   the validator (validation rules 28-31 govern "the commands to run on an
#   unfamiliar board" — that is the safety surface),
#   the probe machinery (`probePack` / `judgeReader` / `probeHint`),
#   the `custom.<id>.` namespace,
#   and the parameter schema of each reader kind.
#
# ── Why it declares no `match` ──
#
# - A pack without `match` never takes part in the "which pack does this
#   board use" question (the first line of `matchPack` is
#   `if (match === undefined) return false`).
#   It occupies the slot of "a recipe", not the slot of "a board".
# - The path where "the connection names a pack" does not look at `match` at
#   all, so the wizard can create a temporary connection whose `board_pack`
#   names `generic-linux`: zero new machinery.
#
# ── It is read-only (in the app) ──
#
# - It is the set of commands to run on a board that has just been connected
#   and is not recognised yet.
#   The user should not edit it by hand: editing it means "let the host run
#   my modified commands on a machine it does not know", and that is what the
#   permission area is for — dangerous actions are off by default.
# - What the user edits is the instantiated copy: each board's pack lives in
#   the user directory, and that copy is a product, not an input.
#
# ── What it gets right and what it cannot know (stated honestly) ──
#
# | Accurate | Not accurate |
# |---|---|
# | Facts: whether something exists, how many, what shape | Names and semantics: which thermal zone is the SoC, whether that duty figure is a utilisation |
#
# - The second column takes knowledge, and knowledge is the agent's job.
#
# ── It only covers quantities that have a single value (a hard boundary) ──
#
# - `file_read` yields exactly one `value` sample, not multiple instances.
#   - So everything below whose count varies is read with `exec_regex`, taking
#     the first line.
#   - Do not write a glob plus a single tag: several instances would be
#     packed into one value (measured 2026-11-19: a glob read of the
#     backlight puts `255\n200` into one `value` — that is a false reading).
# - Quantities that have several instances (thermal zones, network cards) are
#   read line by line with `exec_regex`, one tag one value.

apiVersion: devboard/v1
kind: BoardPack

id: generic-linux
name: Generic embedded Linux (recipe)
version: 1.0.0
description: A recipe of what embedded Linux usually has. The board onboarding wizard runs through it command by command on a board it does not recognise yet, and the green and red results are that board's truth table.

requires:
  transports: [adb, serial, ssh]
  capabilities: [shell, exec]
  min_contract: devboard/v1

# `match` is deliberately absent — see "Why it declares no `match`" in the
# file header.
# - It takes no part in automatic recognition, it is not a board, it is a
#   recipe.

danger_floor_version: 1

# ── Poll groups ─────────────────────────────────────────────────────────────
#
# One group = one round trip: all readers of the same group are combined into
# a single command and fetched in one go.
#
# Groups are split by how often the value changes (the same reason as in
# `rk3588-atk`):
# - `/proc/stat` has to be sampled every second (the utilisation is the
#   difference of two samples), so it is `fast`.
# - Memory changes more slowly, so it is `slow`.
# - Model and kernel version do not change within a day, so they are `rare`.
poll_groups:
  - id: fast
    interval_ms: 1000
    readers: [cpu]

  - id: slow
    interval_ms: 2000
    readers: [mem, loadavg1, loadavg5, loadavg15]

  - id: rare
    interval_ms: 30000
    readers: [model, osrelease, kernel, uptime, thermal, backlight, led, net]

# ── Data sources ─────────────────────────────────────────────────────────────
readers:
  # ── CPU utilisation (a quantity in the core vocabulary) ──
  - id: cpu
    kind: proc_stat
    args:
      stat_path: /proc/stat
      cpuinfo_path: /proc/cpuinfo
    provides:
      - tag: cpu.usage
        sample: usage
      - tag: cpu.core.*.usage
        sample: core.*.usage
      - tag: cpu.core.*.cluster
        sample: core.*.cluster

  # ── Memory (a quantity in the core vocabulary) ──
  - id: mem
    kind: meminfo
    args:
      path: /proc/meminfo
    provides:
      - tag: mem.total_bytes
        sample: total_bytes
      - tag: mem.available_bytes
        sample: available_bytes
      - tag: mem.used_bytes
        sample: used_bytes
      - tag: mem.usage
        sample: usage

  # ── Load (generic, and not in the core vocabulary, so it goes to the custom
  #    namespace) ──
  #
  # `exec_regex` takes only the first capture group, so one reader yields one
  # value, which means 1m/5m/15m need three readers rather than one reader
  # with three tags (measured 2026-11-19: one reader with three tags gives
  # all three tags the same value — a false reading).
  - id: loadavg1
    kind: exec_regex
    args:
      command: cat -- /proc/loadavg
      pattern: '^([0-9.]+)\s'
      format: number
    provides:
      - tag: custom.generic-linux.loadavg.1m
        sample: value

  - id: loadavg5
    kind: exec_regex
    args:
      command: cat -- /proc/loadavg
      pattern: '^[0-9.]+\s+([0-9.]+)\s'
      format: number
    provides:
      - tag: custom.generic-linux.loadavg.5m
        sample: value

  - id: loadavg15
    kind: exec_regex
    args:
      command: cat -- /proc/loadavg
      pattern: '^[0-9.]+\s+[0-9.]+\s+([0-9.]+)\s'
      format: number
    provides:
      - tag: custom.generic-linux.loadavg.15m
        sample: value

  # ── Model (generic, goes to custom) ──
  - id: model
    kind: file_read
    args:
      path: /proc/device-tree/model
      strip_trailing_null: true
    provides:
      - tag: custom.generic-linux.board.model
        sample: value

  # ── System version (generic, goes to custom) ──
  #
  # `file_read` reads the whole file, and `/etc/os-release` has several lines:
  # one value holding all of them is not usable.
  # Read the `PRETTY_NAME` line instead (measured 2026-11-19: the real board
  # carries `PRETTY_NAME="Buildroot 2024.02"`).
  - id: osrelease
    kind: exec_regex
    args:
      command: cat -- /etc/os-release
      pattern: 'PRETTY_NAME="?([^"\r\n]+)"?'
      format: string
    provides:
      - tag: custom.generic-linux.sys.osrelease
        sample: value

  # ── Kernel version (generic, goes to custom) ──
  - id: kernel
    kind: exec_regex
    args:
      command: cat -- /proc/version
      pattern: '^Linux version ([^\s]+)'
      format: string
    provides:
      - tag: custom.generic-linux.sys.kernel
        sample: value

  # ── Uptime (generic, goes to custom) ──
  #
  # `/proc/uptime` holds two numbers (uptime seconds and idle seconds).
  # Only the first one is taken: the second is idle time and is useless for
  # CPU utilisation, which `proc_stat` has already computed.
  - id: uptime
    kind: exec_regex
    args:
      command: cat -- /proc/uptime
      pattern: '^([0-9.]+)'
      format: number
    provides:
      - tag: custom.generic-linux.sys.uptime_seconds
        sample: value

  # ── Thermal zones (generic but coarse — which one is the SoC cannot be
  #    known, and that is the agent's job) ──
  #
  # The `type_map` here is a guess: a generic pack cannot produce the names
  # of a particular board.
  # - It is coarse, so the instantiation has to mark it as a guess
  #   (`provenance.json`).
  - id: thermal
    kind: thermal_zone
    args:
      glob: /sys/class/thermal/thermal_zone*
      type_map:
        cpu-thermal: soc
        gpu-thermal: gpu
        npu-thermal: npu
    provides:
      - tag: custom.generic-linux.temp.zone.*
        sample: zone.*

  # ── Backlight (generic but the count varies, so it is taken one by one) ──
  #
  # No glob: the glob of `file_read` packs several instances into one value
  # (a false reading).
  # - Take the first one: a generic pack cannot say which panel it is, and
  #   that is the agent's job.
  - id: backlight
    kind: exec_regex
    args:
      command: cat -- /sys/class/backlight/backlight/brightness 2>/dev/null || cat -- /sys/class/backlight/backlight1/brightness 2>/dev/null
      pattern: '([0-9]+)'
      format: integer
    provides:
      - tag: custom.generic-linux.backlight.brightness
        sample: value

  # ── LED (generic but the count varies, so the first one is taken) ──
  - id: led
    kind: exec_regex
    args:
      command: cat -- /sys/class/leds/work/brightness 2>/dev/null || cat -- /sys/class/leds/led0/brightness 2>/dev/null
      pattern: '([0-9]+)'
      format: integer
    provides:
      - tag: custom.generic-linux.led.brightness
        sample: value

  # ── Network card (generic but the count varies, so the first one is taken) ──
  - id: net
    kind: exec_regex
    args:
      command: cat -- /sys/class/net/*/address 2>/dev/null | tr -d '\n' | cut -d ' ' -f 1
      pattern: '([0-9a-fA-F:]{17})'
      format: string
    provides:
      - tag: custom.generic-linux.net.mac
        sample: value

# ── Board-specific capabilities (they go to the custom namespace) ────────────
custom: []
