# Golden sample · User space program: compile on the client machine →
# **transfer straight to the board** → place → run → look at the output
#
# ── How it differs from the kernel module one ──
#
# ① The placement differs (`user-program` → `/usr/local/bin/`);
# ② **The executable needs chmod +x** (rule P4 of docs/02 section 3.5);
# ③ **The last step is "run it and look at the output"** — not a
#    measurement but the **output of the command**
#    → the criterion is `verify` (run it once and look at the exit code).

apiVersion: devboard/v1
kind: Workflow

id: meminfo-user.build-run
name: Compile a user space program → transfer straight to the board → run → look at the output
version: 1.0.0
description: Compile the user space program on the client machine, transfer it straight to /usr/local/bin/ on the board, run it and confirm that it runs.

inputs:
  build_dir:
    type: path
    required: true
    maxLength: 200
    description: The project root on the build machine (machine-specific values go here, they do not enter the pack)
  project:
    type: string
    required: true
    maxLength: 200
    description: The name of the project directory (relative to build_dir)
  artifact:
    type: string
    required: true
    maxLength: 100
    description: The executable that goes to the board (what the project calls it is the project's business)

roles:
  build:
    purpose: Where the build runs (the client machine)
    profile: ubuntu-ssh
  target:
    purpose: The board
    profile: board-adb

steps:
  - id: compile
    kind: exec
    role: build
    cmd: "make -C {input:build_dir}/{input:project}"
    timeout_ms: 600000
    readback:
      kind: command_ok

  - id: artifacts
    kind: discover
    role: build
    dir: "{input:build_dir}/{input:project}"
    pattern: "{input:artifact}"
    exclude: ["*.o", "*.d"]
    out: artifacts

  - id: deliver
    kind: file.transfer
    from:
      role: build
      path: "{output:artifacts}"
    to:
      role: target
      placement: user-program
    cmd: "scp {from.path} {role:target.user}@{role:target.host}:{to.path}"
    timeout_ms: 600000
    # **The destination path goes into this slot** (the two later steps use
    # it)
    out: dest
    readback:
      kind: verify
      role: target
      command: "test -f {to.path}"
      timeout_ms: 30000

  # **The executable needs chmod +x** (rule P4 of docs/02 section 3.5)
  - id: make-executable
    kind: exec
    role: target
    cmd: "chmod +x {output:dest}"
    readback:
      kind: verify
      role: target
      command: "test -x {output:dest}"
      timeout_ms: 10000

  - id: run
    kind: exec
    role: target
    cmd: "{output:dest}"
    timeout_ms: 60000
    readback:
      kind: command_ok
