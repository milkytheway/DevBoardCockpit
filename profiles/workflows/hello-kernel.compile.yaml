# Build and deploy · Step one: compile only, do not deploy.
#
# This is the first of the three stages of the "build and deploy" card. Every
# parameter carries a default that the user can change in the card; leaving it
# alone uses the default. The execution itself still happens in the system
# workflow layer, the card only passes the parameters in.

apiVersion: devboard/v1
kind: Workflow

id: hello-kernel.compile
name: Compile a kernel module
version: 1.0.0
description: Compile the hello kernel module on the build machine, compile only, no transfer.

inputs:
  build_dir:
    type: path
    required: false
    default: /home/alientek/build
    maxLength: 200
    description: The project root on the build machine
  project:
    type: string
    required: false
    default: 01-hello
    maxLength: 200
    description: The name of the project directory (relative to build_dir)

roles:
  build:
    purpose: Where the build runs (the client machine)
    profile: ubuntu-ssh

steps:
  - id: compile
    kind: exec
    role: build
    # `cd` rather than `make -C`: this Makefile computes the module directory
    # from $(PWD).
    cmd: "cd {input:build_dir}/{input:project} && make"
    timeout_ms: 1800000
    readback:
      kind: command_ok

  - id: artifacts
    kind: discover
    role: build
    dir: "{input:build_dir}/{input:project}"
    pattern: "*.ko"
    exclude: ["*.o", "*.mod", "*.mod.c", "*.cmd", "*.order", "*.tmp", ".tmp_*"]
    out: artifacts
