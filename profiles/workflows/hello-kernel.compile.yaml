# 编译上板 · 第一步：只编译，不上板。
#
# 这是「编译上板」卡的三段式里的第一段。参数都给了默认值，用户可以在卡里
# 改；留空就用默认值。真正执行仍在系统流程层，卡片只负责把参数递进去。

apiVersion: devboard/v1
kind: Workflow

id: hello-kernel.compile
name: 编译内核模块
version: 1.0.0
description: 在构建机上编译 hello 内核模块，只编译，不传输。

inputs:
  build_dir:
    type: path
    required: false
    default: /home/alientek/build
    maxLength: 200
    description: 构建机上的工程根目录
  project:
    type: string
    required: false
    default: 01-hello
    maxLength: 200
    description: 项目目录名（相对 build_dir）

roles:
  build:
    purpose: 编译所在（客机）
    profile: ubuntu-ssh

steps:
  - id: compile
    kind: exec
    role: build
    # cd（不是 make -C）：这个 Makefile 用 $(PWD) 算模块目录。
    cmd: "cd {input:build_dir}/{input:project} && make"
    timeout_ms: 1800000
    readback:
      kind: command_ok

  - id: artifacts
    kind: discover
    role: build
    dir: "{input:build_dir}/{input:project}"
    pattern: "*.ko"
    exclude: ["*.o", "*.mod", "*.mod.c", "*.cmd", "*.order", "*.tmp", ".tmp_*"]
    out: artifacts
