# 存储测速 —— **写一遍 + 读一遍，报两个数**
#
# ── 为什么写与读要分开量 ──
#
# eMMC 的写与读差一个数量级 ✓（实测 2026-11-16：写 **235 MB/s** ✓ ·
# 读 **345 MB/s** ✓）→ **只报一个数会骗人** ✓。
#
# ── 写测速必须 `conv=fdatasync` ──
#
# 不加它，dd 写完就返回 —— **那测的是「进缓存的速度」** ✗，
# 不是「落到介质上的速度」✗。手册 §2.14.2 也这么写 ✓。
#
# ── 落哪 ──
#
# **挂载点下面的一个文件** ✓（不是块设备 ✓ —— 写块设备命中危险地板 ✓）。
# 测完**删掉** ✓（不留垃圾 ✓）。

apiVersion: devboard/v1
kind: Workflow

id: storage-benchmark.measure
name: 存储测速
version: 1.0.0
description: 在指定挂载点写一个文件量写入速度、用 hdparm 量读取速度，测完清理临时文件。

inputs:
  mountpoint:
    type: string
    required: false
    maxLength: 100
    default: /userdata
    description: 测速的挂载点（必须是挂载点，不能是块设备）
  size_mb:
    type: integer
    required: false
    default: 50
    description: 写多少 MB
  device:
    type: string
    required: false
    maxLength: 100
    default: /dev/mmcblk0p8
    description: 量读取速度用的块设备（只读，不写）

roles:
  target:
    purpose: 被测的板子
    profile: board-adb

steps:
  # ① 写入测速（**fdatasync** ✓ —— 否则测的是缓存速度 ✗）
  - id: write
    kind: exec
    role: target
    # ⚠️ **`dd` 的统计是打到 stderr 的** ✓（实测 ✓）→ 不合并的话**产出槽是空的** ✓
    #   （执行器只取 stdout ✓ —— 契约 `spec/04` §2.4 说的就是 stdout ✓）。
    # → **自己合并** ✓（`2>&1` ✓）。
    cmd: "dd if=/dev/zero of={input:mountpoint}/.cockpit-bench bs=1024k count={input:size_mb} conv=fdatasync 2>&1"
    timeout_ms: 600000
    out: write_result
    readback:
      kind: command_ok

  # ② 读测速（**hdparm** ✓ —— 它读的是块设备本身 ✓）
  - id: read
    kind: exec
    role: target
    cmd: "hdparm -t {input:device}"
    timeout_ms: 300000
    out: read_result
    readback:
      kind: command_ok

  # ③ 清理（**不留半截文件** ✓）
  - id: cleanup
    kind: exec
    role: target
    cmd: "rm -f {input:mountpoint}/.cockpit-bench"
    timeout_ms: 60000
    readback:
      kind: command_ok

  # ④ 确实清掉了 ✓
  - id: assert-clean
    kind: assert
    role: target
    readback:
      kind: verify
      role: target
      command: "test ! -e {input:mountpoint}/.cockpit-bench"
      timeout_ms: 10000
    on_mismatch: fail