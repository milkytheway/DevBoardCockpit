# Build and deploy · Step three: load only (requires the module to have been
# uploaded to the board already).
#
# Run `depmod -a` and then `modprobe` by name; not `insmod` by path (rule P2 of
# docs/02-device-facts.md section 3.5). Finally confirm on the board with `lsmod` that it is
# really loaded.

apiVersion: devboard/v1
kind: Workflow

id: hello-kernel.load
name: Load a kernel module
version: 1.0.0
description: Load the module on the board by name after depmod, and confirm the load with lsmod.

inputs:
  module:
    type: string
    required: false
    default: hello
    maxLength: 100
    description: The name of the module (without .ko)

roles:
  target:
    purpose: The board
    profile: board-adb

steps:
  - id: load
    kind: exec
    role: target
    cmd: "depmod -a && modprobe {input:module}"
    timeout_ms: 120000
    readback:
      kind: command_ok

  - id: assert-loaded
    kind: assert
    readback:
      kind: verify
      role: target
      command: "lsmod | grep -q {input:module}"
      timeout_ms: 30000
    on_mismatch: fail
