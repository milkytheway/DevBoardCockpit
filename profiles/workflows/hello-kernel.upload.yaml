# Build and deploy · Step two: upload only (requires the build artefacts to
# exist already).
#
# First discover the *.ko by rule, then transfer it straight to the kernel
# module directory of the board, and finally run `test -f` on the board.

apiVersion: devboard/v1
kind: Workflow

id: hello-kernel.upload
name: Upload a kernel module
version: 1.0.0
description: Transfer the kernel module from the build machine straight to the module directory of the board, and confirm on the board that the file exists.

inputs:
  build_dir:
    type: path
    required: false
    default: /home/alientek/build
    maxLength: 200
    description: The project root on the build machine
  project:
    type: string
    required: false
    default: 01-hello
    maxLength: 200
    description: The name of the project directory (relative to build_dir)

roles:
  build:
    purpose: Where the build runs (the client machine)
    profile: ubuntu-ssh
  target:
    purpose: The board
    profile: board-adb

steps:
  - id: artifacts
    kind: discover
    role: build
    dir: "{input:build_dir}/{input:project}"
    pattern: "*.ko"
    exclude: ["*.o", "*.mod", "*.mod.c", "*.cmd", "*.order", "*.tmp", ".tmp_*"]
    out: artifacts

  - id: deliver
    kind: file.transfer
    from:
      role: build
      path: "{output:artifacts}"
    to:
      role: target
      placement: kernel-module
    cmd: "scp {from.path} {role:target.user}@{role:target.host}:{to.path}"
    timeout_ms: 1800000
    out: dest
    readback:
      kind: verify
      role: target
      command: "test -f {to.path}"
      timeout_ms: 30000
