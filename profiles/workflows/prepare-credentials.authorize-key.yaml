# Golden sample · Credential preparation: put the public key of the source
# role into the authorized_keys of the target role
#
# ── Why it is a separate step ──
#
# Letting the client machine transfer straight to the board needs the
# public key of the client machine in the `~/.ssh/authorized_keys` of the
# board.
# - That means writing the ssh configuration of a target machine = a
#   write at the destructive level
# - so it cannot be hidden inside the command of some step (hiding it
#   means nobody knows that it happened)
# - it is an explicit step declared as destructive → a human confirms
#   every time
#
# ── Why it takes two steps ──
#
# The public key is on the source role (the client machine, at
# `~/.ssh/id_ed25519.pub`), and what has to be written is on the target
# role (the board) → across roles
# - the first step reads on the source (the output goes into the slot
#   `pubkey`)
# - the second step writes on the target (destructive)

apiVersion: devboard/v1
kind: Workflow

id: prepare-credentials.authorize-key
name: Install the public key of the source role into the authorized_keys of the target role
version: 1.0.0
description: Read the public key on the source role and append it to the authorized_keys of the target role (destructive → a human has to confirm).

inputs:
  key_path:
    type: path
    required: true
    maxLength: 200
    description: The path of the private key on the source role (the public key is it plus `.pub`)

roles:
  build:
    purpose: Where the public key is (the source role)
    profile: ubuntu-ssh
  target:
    purpose: The machine that receives the public key (the target role)
    profile: board-adb

steps:
  # ① Read the public key on the source role (the output goes into the
  #    slot)
  - id: read-pubkey
    kind: exec
    role: build
    cmd: "cat {input:key_path}.pub"
    out: pubkey
    readback:
      kind: command_ok

  # ② Write authorized_keys on the target role — destructive
  - id: authorize
    kind: exec
    role: target
    danger: destructive
    cmd: "mkdir -p ~/.ssh && chmod 700 ~/.ssh && { grep -qF '{output:pubkey}' ~/.ssh/authorized_keys 2>/dev/null || { cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys; } }"
    readback:
      kind: verify
      role: target
      command: "grep -qF '{output:pubkey}' ~/.ssh/authorized_keys"
      timeout_ms: 10000
