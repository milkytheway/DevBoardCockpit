# Boot log — read the persistent kernel and user-space boot records over the
# serial console and keep the newest boot section on the host.
#
# The board is read only. This workflow never asks for a destructive action.

apiVersion: devboard/v1
kind: Workflow

id: boot-log.capture
name: Boot log
version: 1.0.0
description: Read the messages the kernel printed since the boot into a host-side workflow output.

inputs: {}

roles:
  target:
    purpose: The board whose boot log is read
    profile: board-serial

steps:
  # Read both persistent syslog files. The first file rotates out the older
  # records; the second contains the current boot.
  - id: capture
    kind: exec
    role: target
    cmd: "cat /var/log/messages.0 2>/dev/null; cat /var/log/messages 2>/dev/null"
    timeout_ms: 30000
    out: boot_log
    readback:
      kind: command_ok

  # At least one persistent log file has to exist.
  - id: assert-not-empty
    kind: assert
    role: target
    readback:
      kind: verify
      role: target
      command: "test -s /var/log/messages.0 || test -s /var/log/messages"
      timeout_ms: 10000
    on_mismatch: fail
