# Camera capture — **take one picture with a MIPI CSI camera and keep it on
# the board**
#
# ── How the node is chosen ──
#
# Manual section 2.8 gives the **silkscreen ↔ /dev/videoX** mapping (measured:
# the name of all four nodes is
# `rkisp_mainpath` → **the model cannot be recognised** → **only the
# silkscreen mapping identifies them**):
#
#   MIPI CSI1 → /dev/video62
#   MIPI CSI2 → /dev/video71
#   MIPI CSI3 → /dev/video44
#   MIPI CSI4 → /dev/video53
#
# - The workflow **lists the available nodes** (`v4l2-ctl --list-devices` is
#   available on the board) →
#   the user **sees what there is** first, and only then decides which one to
#   capture.
#
# ── What happens with no camera attached ──
#
# **It fails honestly** (measured 2026-11-16: with no camera attached gst
# reports `not-negotiated (-4)`)
# → the criterion "the file is not empty" **does not pass** → the step is red
# → it **does not pretend a picture was taken**.

apiVersion: devboard/v1
kind: Workflow

id: camera-capture.capture
name: Camera capture
version: 1.0.0
description: List the available MIPI CSI nodes, capture one jpg frame with gst-launch and store it on the board, and confirm that the file is not empty.

inputs:
  device:
    type: string
    required: false
    maxLength: 40
    default: /dev/video62
    description: The camera node (MIPI CSI1=video62 / CSI2=video71 / CSI3=video44 / CSI4=video53)
  path:
    type: string
    required: false
    maxLength: 200
    default: /userdata/snapshot.jpg
    description: Where the captured picture is stored

roles:
  target:
    purpose: The board being photographed
    profile: board-adb

steps:
  # ① List them first (**let the user see what there is** — not being able
  #   to recognise the model is a fact of this board)
  #
  # **Not `v4l2-ctl --list-devices`** — it **opens every device node**
  #   → a node whose camera is not plugged in makes it **fail as a whole**
  #   (measured 2026-11-16: `Failed to open /dev/video0: No such device` →
  #   non-zero exit code).
  # - **Read sysfs instead** (**touches no device node** → there is always
  #   output).
  #
  # Only the `rkisp*` ones are picked — those are the **real capture nodes**
  # (the rest are CIF stream / scaler / tooling nodes, which are of no use
  # for a capture).
  - id: list-devices
    kind: exec
    role: target
    cmd: "for d in /sys/class/video4linux/video*; do n=$(cat $d/name 2>/dev/null); case $n in rkisp*) echo $(basename $d) $n;; esac; done"
    timeout_ms: 30000
    out: devices
    readback:
      kind: command_ok

  # ② Capture one frame
  - id: capture
    kind: exec
    role: target
    cmd: "gst-launch-1.0 v4l2src device={input:device} ! video/x-raw,format=NV12,width=640,height=480,framerate=30/1 ! videoconvert ! jpegenc ! multifilesink location={input:path}"
    timeout_ms: 120000
    readback:
      kind: command_ok

  # ③ The file really is not empty (**red with no camera** — honest)
  - id: assert-image
    kind: assert
    role: target
    readback:
      kind: verify
      role: target
      command: "test -s {input:path}"
      timeout_ms: 30000
    on_mismatch: fail