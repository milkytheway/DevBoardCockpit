# Board health check — **ask everything about "what state is this board in"
# in one go**
#
# ── Why it exists ──
#
# The first question with a new board, or with a board that starts behaving
# oddly, is always "how is it actually doing". Typing `adb shell` line by
# line is slow, and it is easy to miss something.
#
# - This workflow **looks at everything there is to look at**, and **keeps
#   the facts it can see in the output slots**
#   (the host displays the output, so the user does not have to go to the
#   board and check again).
#
# ── How the criteria are designed ──
#
# **Must pass** (not passing means the board has a problem) → `on_mismatch:
# fail`
# **Not necessarily passing** (no network cable / no TF card / the time is not
# set) → `on_mismatch: continue`
#   - It still reports "not passed" (visible in the timeline) but does not
#     turn the whole health check into a failure.
#
# ── Measured basis (2026-11-16 · real board ATK-DLRK3588) ──
#
#   The system time of the board is 1970-01-01 (no RTC reading, no NTP) →
#   so `assert-clock` **fails on a new board** — that is exactly what it is
#   there to say.

apiVersion: devboard/v1
kind: Workflow

id: board-healthcheck.verify
name: Board health check
version: 1.0.0
description: Ask the board about its model, kernel, uptime, memory, temperature, governor, network and time in one go; an item that must pass reports an error when it fails.

inputs:
  clock_expect:
    type: string
    required: false
    maxLength: 32
    default: "2020"
    description: The year the system time has to be later than (an earlier time means the board has not synchronised)

roles:
  target:
    purpose: The board being checked
    profile: board-adb

steps:
  # ── Facts ────────────────────────────────────────────────────
  - id: model
    kind: exec
    role: target
    # The model read with `cat` carries one trailing NUL (measured
    # 2026-11-16), and
    #   splicing it into a command is **rejected by the injection guard**
    #   ("the path contains a newline or a null character"), which is
    #   correct.
    # - Strip it while reading (`tr -d`); do not rely on the downstream
    #   tolerating it.
    cmd: "tr -d '\\0' < /proc/device-tree/model"
    out: model
    readback:
      kind: command_ok

  - id: kernel
    kind: exec
    role: target
    cmd: "uname -r"
    out: kernel
    readback:
      kind: command_ok

  - id: uptime
    kind: exec
    role: target
    cmd: "cat /proc/uptime"
    out: uptime
    readback:
      kind: command_ok

  - id: memory
    kind: exec
    role: target
    cmd: "grep -E 'MemTotal|MemAvailable' /proc/meminfo"
    out: memory
    readback:
      kind: command_ok

  - id: temperature
    kind: exec
    role: target
    cmd: "cat /sys/class/thermal/thermal_zone0/temp"
    out: temperature_millidegree
    readback:
      kind: command_ok

  - id: governor
    kind: exec
    role: target
    cmd: "cat /sys/devices/system/cpu/cpufreq/policy0/scaling_governor"
    out: governor
    readback:
      kind: command_ok

  - id: network
    kind: exec
    role: target
    cmd: "ip -br addr show"
    out: network
    readback:
      kind: command_ok

  - id: clock
    kind: exec
    role: target
    cmd: "date '+%Y-%m-%d %H:%M:%S'"
    out: clock
    readback:
      kind: command_ok

  - id: modules
    kind: exec
    role: target
    cmd: "lsmod | wc -l"
    out: module_count
    readback:
      kind: command_ok

  # ── Criteria that must pass ──────────────────────────────────────────
  - id: assert-model
    kind: assert
    role: target
    readback:
      kind: verify
      role: target
      command: "echo {output:model} | grep -q ATK-DLRK3588"
      timeout_ms: 10000
    on_mismatch: fail

  - id: assert-memory
    kind: assert
    role: target
    readback:
      kind: verify
      role: target
      command: "grep -q 'MemTotal:[[:space:]]*[1-9]' /proc/meminfo"
      timeout_ms: 10000
    on_mismatch: fail

  # ── Report-only verdicts ────────────────────────────────────────────
  #
  # **Why this is not an `assert`**
  #
  # The contract `spec/02` section 4.5 says it clearly: **`verify` is "poll
  # the verification command until it succeeds or times out"**
  # - It answers "when does this condition come true"
  # - while "is the clock of the board right now" is a **one-shot static
  #   judgement** (it does not "get better on its own after a while")
  # - Writing it with `verify` waits 10 seconds and then reports "the
  #   verification command did not succeed within 10000ms", which is a false
  #   statement (the command returned long ago, only with a non-zero exit
  #   code).
  #
  # - **Use `exec` and put the conclusion into words**:
  #   the facts are already in the two slots (`clock`), and here they get one
  #   sentence in plain language.
  - id: clock-verdict
    kind: exec
    role: target
    cmd: "if [ $(date +%Y) -gt {input:clock_expect} ]; then echo OK; else echo 'the board clock is not set (run sysclock.set once first)'; fi"
    out: clock_verdict
    readback:
      kind: command_ok