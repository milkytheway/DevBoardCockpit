# Golden sample · Kernel module: compile on the client machine → **transfer
# straight to the board** → place → modprobe
#
# ── What this sample proves ──
#
# ① **The artefact is not a hard-coded file name**: `discover` finds `*.ko`
#    (not `hello.ko`);
# ② **The placement follows the rules of the board**: `placement:
#    kernel-module` → the host resolves it to
#    `/usr/lib/modules/<version>/extra/` (**not** hard-coded in the pack, so
#    another board does not change this line);
# ③ **Straight transfer**: the transfer command runs on the **source role
#    (the client machine)**;
# ④ **A criterion across two roles**: the `readback` of the transfer step
#    **names role: target**
#    → "is that file really on the board now" (this is what the readback of
#    a board pack cannot verify, so the workflow layer has to speak this
#    vocabulary itself);
# ⑤ **Load by name, not by path**: `modprobe <name>`,
#    never `insmod /path/x.ko` (rule P2 of docs/02 section 3.5).

apiVersion: devboard/v1
kind: Workflow

id: hello-kernel.build-run
name: Compile a kernel module → transfer straight to the board → install → run
version: 1.0.0
description: Compile the kernel module on the client machine, transfer it from the client machine straight to the canonical location of the board, and load it by name after depmod -a.

inputs:
  build_dir:
    type: path
    required: true
    maxLength: 200
    description: The project root on the build machine (machine-specific values go here, they do not enter the pack)
  project:
    type: string
    required: true
    maxLength: 200
    description: The name of the project directory (relative to build_dir)

roles:
  build:
    purpose: Where the build runs (the client machine)
    profile: ubuntu-ssh
  target:
    purpose: The board
    profile: board-adb

steps:
  # ① Compile (long running: minutes → it needs a generous timeout)
  - id: compile
    kind: exec
    role: build
    # **`cd` rather than `make -C`** (hit on a real board on 2026-11-15):
    # this Makefile computes `M=` (the module directory of the kernel tree)
    # from `$(PWD)`, and **`make -C` only changes the current directory of
    # make, not the `PWD` environment variable**
    # → it builds `/home/alientek/Makefile` instead (measured error).
    # - The default target is `all` (`modules` is a target of the kernel tree,
    #   not of this project).
    cmd: "cd {input:build_dir}/{input:project} && make"
    timeout_ms: 1800000
    # **The criterion of a successful build is the command returning 0** (a
    # build is not a measurement on the board)
    readback:
      kind: command_ok

  # ② Artefact discovery (**by rule, no hard-coded file name**)
  - id: artifacts
    kind: discover
    role: build
    dir: "{input:build_dir}/{input:project}"
    pattern: "*.ko"
    exclude: ["*.o", "*.mod", "*.mod.c", "*.cmd", "*.order", "*.tmp", ".tmp_*"]
    out: artifacts

  # ③ **Straight transfer**: the transfer command runs on the **source role
  #    (the client machine)**; the host resolves the destination from the
  #    placement
  - id: deliver
    kind: file.transfer
    from:
      role: build
      path: "{output:artifacts}"
    to:
      role: target
      placement: kernel-module
    cmd: "scp {from.path} {role:target.user}@{role:target.host}:{to.path}"
    timeout_ms: 1800000
    # **The destination path goes into this slot** (later steps use it:
    # `modprobe` does not need it, but a user space program does)
    out: dest
    # **The criterion names a role** → it reads on the **board**: "did that
    # file really arrive"
    readback:
      kind: verify
      role: target
      command: "test -f {to.path}"
      timeout_ms: 30000

  # ④ Install and load by name (**not insmod**; `depmod -a` runs first)
  - id: load
    kind: exec
    role: target
    cmd: "depmod -a && modprobe {output:artifacts.name}"
    timeout_ms: 120000
    readback:
      kind: command_ok

  # ⑤ Confirm that it is really loaded (**ask the board on the board**: is it
  #    in `lsmod`)
  - id: assert-loaded
    kind: assert
    readback:
      kind: verify
      role: target
      command: "lsmod | grep -q {output:artifacts.name}"
      timeout_ms: 30000
    on_mismatch: fail
