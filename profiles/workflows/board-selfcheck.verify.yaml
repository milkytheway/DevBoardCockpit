# Vendor factory self check — **run the check scripts Alientek wrote**
#
# ── Why use it instead of rewriting our own ──
#
# The board **already carries** a factory self check:
# `/opt/ui/src/apps/resource/pcba/ATK-DLRK3588/`
# (measured · it is the one the factory test app uses · the vendor runs it on
# every board).
#
# - **Do not write another one** — that would leave two measures of "the
#   check" in play, ours and the vendor's.
# - Call its scripts directly — **the check items are the factory ones**.
#
# ── Two levels: "must pass" and "report" ──
#
# The scripts **fail because a peripheral is not plugged in** (measured: eth1
# with no network cable → exit 1; no TF card → `hdparm -t /dev/mmcblk1p1`
# fails).
# - That **does not mean the board is broken** → use `on_mismatch: continue`
#   (it still reports "not passed" in the timeline, so the user sees it).
#
# `mic_test.sh` / `loudspeaker_test.sh` are **not** in the list —
#    they are `for i in {1..1000}` **infinite loops** (measured from the
#    script contents) → one run takes tens of minutes → they are **left
#    out**.

apiVersion: devboard/v1
kind: Workflow

id: board-selfcheck.verify
name: Vendor factory self check
version: 1.0.0
description: Call the factory check scripts that ship on the board; the items that must pass (CPU frequency / wired network / WiFi / Bluetooth) report an error when they fail, and the items whose peripheral is missing are only reported.

# This one has **no parameters** — everything it checks is fixed
# (but the `inputs` key **has to be there**, the shape of a workflow pack is
# closed)
inputs: {}

roles:
  target:
    purpose: The board being checked
    profile: board-adb

steps:
  # ── Must pass ────────────────────────────────────────────────────
  - id: cpufreq
    kind: exec
    role: target
    cmd: "sh /opt/ui/src/apps/resource/pcba/ATK-DLRK3588/cpufre_test.sh"
    timeout_ms: 30000
    readback:
      kind: command_ok

  - id: eth0
    kind: exec
    role: target
    cmd: "sh /opt/ui/src/apps/resource/pcba/ATK-DLRK3588/eth0_test.sh"
    timeout_ms: 30000
    readback:
      kind: command_ok

  - id: wifi
    kind: exec
    role: target
    cmd: "sh /opt/ui/src/apps/resource/pcba/ATK-DLRK3588/wifi_test.sh"
    timeout_ms: 60000
    readback:
      kind: command_ok

  - id: bluetooth
    kind: exec
    role: target
    cmd: "sh /opt/ui/src/apps/resource/pcba/ATK-DLRK3588/bluetooth_test.sh"
    timeout_ms: 60000
    readback:
      kind: command_ok

  # ── Report only (a missing peripheral is a **fact**, not a fault) ──
  #
  # **Also no `assert` here** — the reason is the same as in the health
  # check: `verify` is "wait until it holds", while "is this peripheral
  # plugged in" is a **one-shot fact**.
  # - Run it once and write the conclusion into the output slot (the user
  #   sees which peripheral is absent).
  - id: eth1
    kind: exec
    role: target
    cmd: "sh /opt/ui/src/apps/resource/pcba/ATK-DLRK3588/eth1_test.sh >/dev/null 2>&1 && echo 'second network port: has an IP' || echo 'second network port: no network cable or no IP'"
    timeout_ms: 30000
    out: eth1_verdict
    readback:
      kind: command_ok

  - id: rtc
    kind: exec
    role: target
    cmd: "sh /opt/ui/src/apps/resource/pcba/ATK-DLRK3588/rtc_test.sh >/dev/null 2>&1 && echo 'hardware RTC: node present' || echo 'hardware RTC: node absent'"
    timeout_ms: 30000
    out: rtc_verdict
    readback:
      kind: command_ok

  - id: sdcard
    kind: exec
    role: target
    cmd: "sh /opt/ui/src/apps/resource/pcba/ATK-DLRK3588/sdcard_test.sh >/dev/null 2>&1 && echo 'TF card: readable' || echo 'TF card: not inserted or not readable'"
    timeout_ms: 60000
    out: sdcard_verdict
    readback:
      kind: command_ok