# 黄金样本 · 凭据准备：把**源目标**的公钥装进**目标目标**的 authorized_keys
#
# ── 为什么它是**独立的**一步（ADR-D31 R7 / 计划 6 的 A10）──
#
# 「让客机能直传板子」需要**客机的公钥**在**板子的** `~/.ssh/authorized_keys` 里。
# → 那是**写目标机器的 ssh 配置** = **destructive 级**的写 ✓
# → 所以它**不能藏在某个步骤的命令里**（藏起来 = 没人知道它做过什么 ✗）
# → 它是**一个显式的、声明为 destructive 的步骤** ✓ → **每次都要人确认** ✓
#
# ── 为什么它分两步 ──
#
# 公钥在**源目标**上（客机的 `~/.ssh/id_ed25519.pub`），
# 要写进的是**目标目标**（板子）→ **跨目标** ✓
# → 第一步在源上**读**（输出进槽 `pubkey` ✓）
# → 第二步在目标上**写**（destructive ✓）

formatVersion: 1
kind: Workflow

id: prepare-credentials.authorize-key
name: 把源目标的公钥装进目标目标的 authorized_keys
version: 1.0.0
description: 读源目标上的公钥 → 追加到目标目标的 authorized_keys（**destructive → 必须人确认**）。

inputs:
  key_path:
    type: path
    required: true
    maxLength: 200
    description: 源目标上的私钥路径（公钥是它 + `.pub`）

roles:
  build:
    purpose: 公钥所在（源目标）
    profile: ubuntu-ssh
  target:
    purpose: 要装公钥的机器（目标目标）
    profile: board-adb

steps:
  # ① 在**源目标**上读公钥（输出进槽 ✓）
  - id: read-pubkey
    kind: exec
    role: build
    cmd: "cat {input:key_path}.pub"
    out: pubkey
    readback:
      kind: command_ok

  # ② 在**目标目标**上写 authorized_keys —— **destructive** ✓
  - id: authorize
    kind: exec
    role: target
    danger: destructive
    cmd: "mkdir -p ~/.ssh && chmod 700 ~/.ssh && { grep -qF '{output:pubkey}' ~/.ssh/authorized_keys 2>/dev/null || { cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys; } }"
    readback:
      kind: verify
      role: target
      command: "grep -qF '{output:pubkey}' ~/.ssh/authorized_keys"
      timeout_ms: 10000
