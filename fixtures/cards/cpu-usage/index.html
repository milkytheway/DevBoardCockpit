<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

         **内联脚本会被浏览器拒**（module 也一样）。 -->
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./card.js"></script>
  </head>
  <body>
    <div class="label">CPU 占用</div>
    <div><span id="value" class="cockpit-pending"></span><span class="cockpit-unit">%</span></div>
    <div class="foot">
      <span id="note" class="cockpit-note">等待第一次采样</span>
      <span id="age" class="cockpit-age"></span>
    </div>
  </body>
</html>
