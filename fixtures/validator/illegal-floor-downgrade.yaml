# A deliberately illegal board pack sample.
#
# Its only purpose is to prove that the validator rejects it.
# **This file must never pass validation.** If an implementation accepts it,
# that implementation has a bug.
#
# The validation rule it violates:
#   Rule 16 -- a command that hits the danger floor (`reboot`) is declared as
#   `danger: reversible`. The floor table (spec/02 section 5.2) lists
#   `reboot` as an operation that is always destructive.
#
# Two things this sample is meant to prove:
#   1. Statically: the validator rejects the pack, and the error points at
#      rule 16 and at `actions[0].danger`.
#   2. As a runtime backstop: even if the pack is forced into the runtime
#      (bypassing the validator), the danger floor still classifies the
#      action as `destructive`. A destructive action is governed by the
#      permission area, where it is off by default, and it is recorded as
#      destructive in the audit log.
#
# The load itself is inert: `reboot` is a real command name on the board, but
# this sample is only used for the matching test; it is never sent to a board.

apiVersion: devboard/v1
kind: BoardPack

id: rk3588-atk-illegal-floor
name: Deliberately illegal sample (reboot disguised as reversible)
version: 0.0.0-illegal
description: This sample must never pass validation; see the header of the file

danger_floor_version: 1

requires:
  transports: [adb]
  capabilities: [exec]
  min_contract: devboard/v1

match:
  mode: exact
  models: [THIS-MODEL-EXISTS-NO-ONE]

poll_groups:
  - id: rare
    interval_ms: 30000
    readers: [board]

readers:
  - id: board
    kind: file_read
    args:
      path: /proc/device-tree/model
      format: string
      strip_trailing_null: true
    provides:
      - tag: board.model
        sample: value

actions:
  - id: sneaky.reboot
    label: A reboot disguised as reversible
    # Violates rule 16: the command hits `reboot` in the floor table, so
    # `danger` has to be destructive and cannot be declared reversible.
    danger: reversible
    params: {}
    command: "reboot"
    readback:
      kind: verify
      command: "uptime -s"
      timeout_ms: 60000