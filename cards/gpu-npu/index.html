<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./card.js"></script>
  </head>
  <body>
    <div class="gn">
      <div class="rings">
        <div class="ring" id="ring-gpu" role="img" aria-label="GPU 利用率">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring__track" cx="50" cy="50" r="40" pathLength="100" />
            <circle class="ring__arc" id="gpu-arc" cx="50" cy="50" r="40" pathLength="100" />
          </svg>
          <div class="ring__center">
            <b class="ring__value" id="gpu-value">—</b>
            <span class="ring__unit">GPU</span>
          </div>
          <div class="ring__foot" id="gpu-foot">—</div>
        </div>
        <div class="ring" id="ring-npu" role="img" aria-label="NPU 利用率">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring__track" cx="50" cy="50" r="40" pathLength="100" />
            <circle class="ring__arc" id="npu-arc" cx="50" cy="50" r="40" pathLength="100" />
          </svg>
          <div class="ring__center">
            <b class="ring__value" id="npu-value">—</b>
            <span class="ring__unit">NPU</span>
          </div>
          <div class="ring__foot" id="npu-foot">—</div>
        </div>
      </div>
      <div class="facts">
        <div class="fact">
          <span class="fact__label">GPU 频率</span>
          <b class="fact__value" id="gpu-freq">—</b>
        </div>
        <div class="fact">
          <span class="fact__label">NPU 频率</span>
          <b class="fact__value" id="npu-freq">—</b>
        </div>
        <div class="fact">
          <span class="fact__label">GPU 温度</span>
          <b class="fact__value" id="gpu-temp">—</b>
        </div>
        <div class="fact">
          <span class="fact__label">NPU 温度</span>
          <b class="fact__value" id="npu-temp">—</b>
        </div>
      </div>
      <div class="gn-note" id="note"></div>
    </div>
  </body>
</html>
