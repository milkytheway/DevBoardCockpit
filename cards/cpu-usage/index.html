<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- Scripts and styles live in separate files: the host injects the
         contract CSP (`script-src 'self'`), so inline scripts are refused. -->
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./card.js"></script>
  </head>
  <body>
    <div class="cpu">
      <div class="cpu-top">
        <div class="gauge" id="gauge" role="img" aria-label="CPU 总占用">
          <svg class="gauge__svg" viewBox="0 0 220 126" aria-hidden="true">
            <defs>
              <linearGradient id="arc-gradient" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="var(--cockpit-accent)" />
                <stop offset="100%" stop-color="var(--cockpit-accent-2)" />
              </linearGradient>
            </defs>
            <path class="gauge__track" d="M 18 110 A 92 92 0 0 1 202 110" pathLength="100" />
            <path class="gauge__zone gauge__zone--warn" d="M 18 110 A 92 92 0 0 1 202 110" pathLength="100" />
            <path class="gauge__zone gauge__zone--danger" d="M 18 110 A 92 92 0 0 1 202 110" pathLength="100" />
            <path class="gauge__arc" id="arc" d="M 18 110 A 92 92 0 0 1 202 110" pathLength="100" />
            <line class="gauge__needle" id="needle" x1="110" y1="110" x2="110" y2="34" />
            <circle class="gauge__hub" cx="110" cy="110" r="4.5" />
            <g class="gauge__ticks" aria-hidden="true">
              <text x="18" y="124">0</text>
              <text x="202" y="124" text-anchor="end">100</text>
            </g>
          </svg>
          <div class="gauge__center">
            <div class="gauge__value" id="value">—</div>
            <div class="gauge__unit">% 总占用</div>
          </div>
          <div class="gauge__foot">
            <span>min <b id="min">—</b></span>
            <span>p95 <b id="p95">—</b></span>
            <span>max <b id="max">—</b></span>
          </div>
        </div>
        <div class="cpu-meta">
          <div class="meta-grid">
            <div class="meta-card">
              <span class="meta-label">governor</span>
              <b class="meta-value" id="governor">—</b>
            </div>
            <div class="meta-card">
              <span class="meta-label">采样</span>
              <b class="meta-value" id="sample">—</b>
            </div>
          </div>
          <div class="spark">
            <div class="spark__head">
              <span>近 60s</span>
              <span class="spark__now" id="now">—</span>
            </div>
            <svg class="spark__svg" viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true">
              <polyline id="spark" points="" />
            </svg>
          </div>
          <div class="cpu-note" id="note">等待第一次采样</div>
        </div>
      </div>
      <div class="cores" id="cores" aria-label="每核占用"></div>
    </div>
  </body>
</html>
