<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CPU 占用率</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="cpu">
      <div class="cpu__main">
        <span id="value" class="cockpit-value">—</span>
        <span class="cockpit-unit">%</span>
        <span class="cockpit-label">总占用</span>
      </div>
      <div id="groups" class="cpu__groups" aria-hidden="true"></div>
      <p id="note" class="cockpit-note">等待第一次采样</p>
    </main>
    <script type="module" src="./card.js"></script>
  </body>
</html>
