<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>温度</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="temp">
      <div class="temp__main">
        <span id="soc" class="cockpit-value">—</span>
        <span class="cockpit-unit">°C</span>
        <span class="cockpit-label">SoC 温度</span>
      </div>
      <div class="temp__rows">
        <div class="temp__row"><span>GPU</span><b id="gpu">—</b></div>
        <div class="temp__row"><span>NPU</span><b id="npu">—</b></div>
      </div>
      <p id="note" class="cockpit-note">等待第一次采样</p>
    </main>
    <script type="module" src="./card.js"></script>
  </body>
</html>
