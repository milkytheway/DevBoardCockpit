<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./card.js"></script>
  </head>
  <body>
    <div class="th">
      <div class="th-hero" id="hero">
        <div class="th-hero__value" id="soc-value">—</div>
        <div class="th-hero__unit" id="soc-unit">SoC 温度</div>
        <div class="th-hero__at" id="soc-at">—</div>
      </div>
      <div class="th-rows">
        <div class="th-row" id="row-gpu">
          <div class="th-row__head">
            <span class="th-row__label">GPU</span>
            <b class="th-row__value" id="gpu-value">—</b>
          </div>
          <div class="th-track"><span class="th-fill" id="gpu-fill"></span></div>
        </div>
        <div class="th-row" id="row-npu">
          <div class="th-row__head">
            <span class="th-row__label">NPU</span>
            <b class="th-row__value" id="npu-value">—</b>
          </div>
          <div class="th-track"><span class="th-fill" id="npu-fill"></span></div>
        </div>
      </div>
      <div class="th-note" id="note">等待第一次采样</div>
    </div>
  </body>
</html>
