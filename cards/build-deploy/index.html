<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>编译上板</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="bd">
      <ol class="bd__steps" aria-label="编译上板流程">
        <li class="bd__step is-active" data-phase="compile">
          <button type="button" class="bd__step-btn" id="phase-compile">
            <span class="bd__step-dot" aria-hidden>1</span>
            <span class="bd__step-text">
              <b>编译</b>
              <small>只编译</small>
            </span>
          </button>
        </li>
        <li class="bd__step" data-phase="upload">
          <button type="button" class="bd__step-btn" id="phase-upload">
            <span class="bd__step-dot" aria-hidden>2</span>
            <span class="bd__step-text">
              <b>上传</b>
              <small>传到板子</small>
            </span>
          </button>
        </li>
        <li class="bd__step" data-phase="run">
          <button type="button" class="bd__step-btn" id="phase-run">
            <span class="bd__step-dot" aria-hidden>3</span>
            <span class="bd__step-text">
              <b>运行</b>
              <small>加载模块</small>
            </span>
          </button>
        </li>
      </ol>

      <div class="bd__form">
        <label class="bd__field">
          <span>构建目录</span>
          <input id="build-dir" type="text" placeholder="/home/alientek/build" />
        </label>
        <label class="bd__field">
          <span>项目</span>
          <input id="project" type="text" placeholder="01-hello" />
        </label>
        <label class="bd__field">
          <span>模块名</span>
          <input id="module" type="text" placeholder="hello" />
        </label>
      </div>

      <div class="bd__bar">
        <span id="note" class="bd__note">选择一步开始；留空用默认值</span>
        <span id="state" class="bd__state" hidden>运行中</span>
      </div>

      <ol id="steps" class="bd__run" aria-label="本次运行的阶段"></ol>
    </main>
    <script type="module" src="./card.js"></script>
  </body>
</html>
